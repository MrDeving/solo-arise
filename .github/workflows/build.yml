      - name: Create widget v2 (glass cards, urgent glow, checklists, tap actions)
        run: |
          python3 << 'PYEOF'
          import os
          res = "android/app/src/main/res/"
          os.makedirs(res + "drawable", exist_ok=True)
          os.makedirs(res + "layout", exist_ok=True)
          XH = '<?xml version="1.0" encoding="utf-8"?>\n'
          NS = 'xmlns:android="http://schemas.android.com/apk/res/android"'

          def w(p, t):
              with open(res + p, "w", encoding="utf-8") as f:
                  f.write(XH + t.replace("@NS@", NS).strip() + "\n")

          # ---------- per-widget glass card, pill, scrollbar thumb, progress bar ----------
          for kind, hx in (("dailies", "38BDF8"), ("quests", "FBBF24")):
              w("drawable/widget_card_%s.xml" % kind, """
          <layer-list @NS@>
              <item><shape android:shape="rectangle">
                  <gradient android:angle="315" android:startColor="#BD14243A" android:endColor="#940F172A"/>
                  <corners android:radius="24dp"/>
              </shape></item>
              <item><shape android:shape="rectangle">
                  <gradient android:type="radial" android:centerX="1.0" android:centerY="0.0" android:gradientRadius="190dp" android:startColor="#42@HX@" android:endColor="#00@HX@"/>
                  <corners android:radius="24dp"/>
              </shape></item>
              <item android:height="120dp" android:gravity="top"><shape android:shape="rectangle">
                  <gradient android:angle="270" android:startColor="#17FFFFFF" android:endColor="#00FFFFFF"/>
                  <corners android:topLeftRadius="24dp" android:topRightRadius="24dp"/>
              </shape></item>
              <item><shape android:shape="rectangle">
                  <stroke android:width="1dp" android:color="#29FFFFFF"/>
                  <corners android:radius="24dp"/>
              </shape></item>
          </layer-list>""".replace("@HX@", hx))
              w("drawable/widget_pill_%s.xml" % kind, """
          <shape @NS@ android:shape="rectangle">
              <solid android:color="#40@HX@"/>
              <stroke android:width="1dp" android:color="#8C@HX@"/>
              <corners android:radius="30dp"/>
          </shape>""".replace("@HX@", hx))
              w("drawable/widget_thumb_%s.xml" % kind, """
          <shape @NS@ android:shape="rectangle">
              <solid android:color="#B3@HX@"/>
              <size android:width="3dp"/>
              <corners android:radius="2dp"/>
          </shape>""".replace("@HX@", hx))

          w("drawable/widget_bar_dailies.xml", """
          <layer-list @NS@>
              <item android:id="@android:id/background"><shape android:shape="rectangle">
                  <solid android:color="#1AFFFFFF"/>
                  <corners android:radius="4dp"/>
              </shape></item>
              <item android:id="@android:id/progress"><clip><shape android:shape="rectangle">
                  <gradient android:angle="0" android:startColor="#FFFFFF" android:endColor="#E2E8F0"/>
                  <corners android:radius="4dp"/>
              </shape></clip></item>
          </layer-list>""")

          # ---------- row pieces (same look as the preview) ----------
          w("drawable/widget_row2_bg.xml", """
          <shape @NS@ android:shape="rectangle">
              <solid android:color="#12FFFFFF"/>
              <stroke android:width="1dp" android:color="#1CFFFFFF"/>
              <corners android:radius="16dp"/>
          </shape>""")
          w("drawable/widget_row2_done.xml", """
          <shape @NS@ android:shape="rectangle">
              <solid android:color="#09FFFFFF"/>
              <stroke android:width="1dp" android:color="#0FFFFFFF"/>
              <corners android:radius="16dp"/>
          </shape>""")
          w("drawable/widget_row2_urgent.xml", """
          <shape @NS@ android:shape="rectangle">
              <gradient android:angle="315" android:startColor="#73F87171" android:endColor="#E63C0F14"/>
              <stroke android:width="2dp" android:color="#FFFF3B3B"/>
              <corners android:radius="16dp"/>
          </shape>""")
          w("drawable/widget_slab2.xml", """
          <shape @NS@ android:shape="rectangle">
              <solid android:color="#FFFFFFFF"/>
              <corners android:radius="2dp"/>
          </shape>""")
          w("drawable/widget_chk.xml", """
          <shape @NS@ android:shape="rectangle">
              <solid android:color="#52000000"/>
              <corners android:radius="7dp"/>
          </shape>""")
          w("drawable/widget_chk_done.xml", """
          <shape @NS@ android:shape="rectangle">
              <solid android:color="#80000000"/>
              <corners android:radius="7dp"/>
          </shape>""")
          w("drawable/widget_chk_urgent.xml", """
          <shape @NS@ android:shape="rectangle">
              <solid android:color="#52000000"/>
              <stroke android:width="2dp" android:color="#FF3B3B"/>
              <corners android:radius="7dp"/>
          </shape>""")
          w("drawable/widget_chip2.xml", """
          <shape @NS@ android:shape="rectangle">
              <solid android:color="#14FFFFFF"/>
              <stroke android:width="1dp" android:color="#1FFFFFFF"/>
              <corners android:radius="7dp"/>
          </shape>""")
          w("drawable/widget_chip2_open.xml", """
          <shape @NS@ android:shape="rectangle">
              <solid android:color="#29FFFFFF"/>
              <stroke android:width="1dp" android:color="#2EFFFFFF"/>
              <corners android:radius="7dp"/>
          </shape>""")
          w("drawable/widget_clc.xml", """
          <shape @NS@ android:shape="oval">
              <stroke android:width="2dp" android:color="#F87171"/>
          </shape>""")
          w("drawable/widget_clc_on.xml", """
          <shape @NS@ android:shape="oval">
              <solid android:color="#47F87171"/>
              <stroke android:width="2dp" android:color="#F87171"/>
          </shape>""")
          w("drawable/widget_cl_row_bg.xml", """
          <layer-list @NS@>
              <item android:height="1dp" android:gravity="top"><shape android:shape="rectangle">
                  <solid android:color="#0FFFFFFF"/>
              </shape></item>
          </layer-list>""")

          # ---------- urgent border: a red light that runs around the card (12 frames) ----------
          LONG, SHORT, THICK = "72dp", "44dp", "3dp"
          frames = []
          for g, ins in (("top|start", ' android:left="16dp"'), ("top|center_horizontal", ""), ("top|end", ' android:right="16dp"')):
              frames.append((g, ins, LONG, THICK, 0))
          for g, ins in (("end|top", ' android:top="16dp"'), ("end|center_vertical", ""), ("end|bottom", ' android:bottom="16dp"')):
              frames.append((g, ins, THICK, SHORT, 270))
          for g, ins in (("bottom|end", ' android:right="16dp"'), ("bottom|center_horizontal", ""), ("bottom|start", ' android:left="16dp"')):
              frames.append((g, ins, LONG, THICK, 180))
          for g, ins in (("start|bottom", ' android:bottom="16dp"'), ("start|center_vertical", ""), ("start|top", ' android:top="16dp"')):
              frames.append((g, ins, THICK, SHORT, 90))
          for n, (g, ins, fw, fh, ang) in enumerate(frames):
              w("drawable/widget_urg_f%d.xml" % n, """
          <layer-list @NS@>
              <item android:gravity="%s"%s android:width="%s" android:height="%s"><shape android:shape="rectangle">
                  <gradient android:angle="%d" android:startColor="#00FF3B3B" android:endColor="#FFFF8A8A"/>
                  <corners android:radius="2dp"/>
              </shape></item>
          </layer-list>""" % (g, ins, fw, fh, ang))

          # ---------- one task row ----------
          cl = ""
          for i in range(10):
              cl += """
                      <LinearLayout android:id="@+id/cl%d"
                          android:layout_width="match_parent" android:layout_height="wrap_content"
                          android:orientation="horizontal" android:gravity="center_vertical"
                          android:paddingStart="42dp" android:paddingEnd="12dp" android:paddingTop="9dp" android:paddingBottom="9dp"
                          android:background="@drawable/widget_cl_row_bg" android:visibility="gone">
                          <TextView android:id="@+id/cl%dc" android:layout_width="18dp" android:layout_height="18dp"
                              android:gravity="center" android:background="@drawable/widget_clc"
                              android:textSize="10sp" android:textStyle="bold" android:textColor="#FFFFFF"/>
                          <TextView android:id="@+id/cl%dt" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1"
                              android:layout_marginStart="14dp" android:maxLines="2" android:ellipsize="end"
                              android:textSize="13sp" android:textColor="#FFFFFF"/>
                      </LinearLayout>""" % (i, i, i)
          fr = ""
          for n in range(12):
              fr += '\n                <ImageView android:layout_width="match_parent" android:layout_height="match_parent" android:scaleType="fitXY" android:src="@drawable/widget_urg_f%d"/>' % n
          w("layout/widget_task_row.xml", """
          <LinearLayout @NS@
              android:layout_width="match_parent" android:layout_height="wrap_content"
              android:orientation="vertical" android:paddingBottom="7dp">
              <FrameLayout android:layout_width="match_parent" android:layout_height="wrap_content">
                  <LinearLayout android:id="@+id/row_card"
                      android:layout_width="match_parent" android:layout_height="wrap_content"
                      android:orientation="vertical" android:background="@drawable/widget_row2_bg">
                      <LinearLayout android:id="@+id/row_main"
                          android:layout_width="match_parent" android:layout_height="wrap_content"
                          android:orientation="horizontal" android:gravity="center_vertical">
                          <ImageView android:id="@+id/row_bar"
                              android:layout_width="3dp" android:layout_height="match_parent"
                              android:layout_marginStart="8dp" android:layout_marginTop="10dp" android:layout_marginBottom="10dp"
                              android:scaleType="fitXY" android:src="@drawable/widget_slab2"/>
                          <FrameLayout android:id="@+id/row_slab" android:layout_width="40dp" android:layout_height="match_parent">
                              <ImageView android:id="@+id/row_ring"
                                  android:layout_width="24dp" android:layout_height="24dp" android:layout_gravity="center"
                                  android:scaleType="fitXY" android:src="@drawable/widget_ring"/>
                    <ImageView android:id="@+id/row_hole"
                        android:layout_width="20dp" android:layout_height="20dp" android:layout_gravity="center"
                        android:scaleType="fitXY" android:src="@drawable/widget_hole" android:visibility="invisible"/>
                              <TextView android:id="@+id/row_check"
                                  android:layout_width="24dp" android:layout_height="24dp"
                                  android:layout_gravity="center" android:gravity="center"
                                  android:textSize="14sp" android:textStyle="bold" android:textColor="#06101C"/>
                          </FrameLayout>
                          <LinearLayout
                              android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1"
                              android:orientation="vertical" android:gravity="center_vertical" android:minHeight="44dp"
                              android:paddingStart="8dp" android:paddingEnd="8dp" android:paddingTop="10dp" android:paddingBottom="10dp">
                              <TextView android:id="@+id/row_title"
                                  android:layout_width="match_parent" android:layout_height="wrap_content"
                                  android:maxLines="2" android:ellipsize="end"
                                  android:fontFamily="sans-serif-medium" android:textSize="14sp" android:textColor="#FFFFFF"/>
                              <TextView android:id="@+id/row_note"
                                  android:layout_width="match_parent" android:layout_height="wrap_content"
                                  android:layout_marginTop="2dp" android:maxLines="2" android:ellipsize="end"
                                  android:textSize="11sp" android:textColor="#B9C8DA" android:visibility="gone"/>
                          </LinearLayout>
                          <LinearLayout
                              android:layout_width="wrap_content" android:layout_height="wrap_content"
                              android:orientation="vertical" android:gravity="end" android:paddingEnd="10dp">
                              <LinearLayout android:id="@+id/row_urgent"
                                  android:layout_width="wrap_content" android:layout_height="wrap_content"
                                  android:orientation="horizontal" android:gravity="center_vertical" android:visibility="gone">
                                  <ImageView android:layout_width="10dp" android:layout_height="10dp" android:src="@drawable/ic_widget_bolt"/>
                                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                                      android:paddingStart="2dp" android:text="URGENT" android:textSize="9sp" android:textStyle="bold"
                                      android:letterSpacing="0.12" android:textColor="#FF3B3B"/>
                              </LinearLayout>
                              <TextView android:id="@+id/row_cl"
                                  android:layout_width="wrap_content" android:layout_height="wrap_content"
                                  android:layout_marginTop="4dp" android:background="@drawable/widget_chip2"
                                  android:paddingStart="7dp" android:paddingEnd="7dp" android:paddingTop="3dp" android:paddingBottom="3dp"
                                  android:textSize="10sp" android:textStyle="bold" android:textColor="#FFFFFF" android:visibility="gone"/>
                              <LinearLayout android:id="@+id/row_streak"
                                  android:layout_width="wrap_content" android:layout_height="wrap_content"
                                  android:layout_marginTop="4dp" android:orientation="horizontal" android:gravity="center_vertical"
                                  android:visibility="gone">
                                  <ImageView android:layout_width="9dp" android:layout_height="7dp" android:src="@drawable/ic_widget_chev"/>
                                  <TextView android:id="@+id/row_streak_n"
                                      android:layout_width="wrap_content" android:layout_height="wrap_content"
                                      android:paddingStart="3dp" android:textSize="9sp" android:textStyle="bold" android:textColor="#80FFFFFF"/>
                              </LinearLayout>
                          </LinearLayout>
                      </LinearLayout>
                      <LinearLayout android:id="@+id/row_cl_list"
                          android:layout_width="match_parent" android:layout_height="wrap_content"
                          android:orientation="vertical" android:visibility="gone">@CL@
                      </LinearLayout>
                  </LinearLayout>

                  <ViewFlipper android:id="@+id/row_pulse"
                      android:layout_width="match_parent" android:layout_height="match_parent"
                      android:autoStart="true" android:flipInterval="1000" android:visibility="gone">
                      <ImageView android:id="@+id/row_pulse_a" android:layout_width="match_parent" android:layout_height="match_parent"
                          android:scaleType="fitXY" android:src="@drawable/widget_pulse_obs"/>
                      <ImageView android:layout_width="match_parent" android:layout_height="match_parent"/>
                  </ViewFlipper>
              </FrameLayout>
          </LinearLayout>""".replace("@CL@", cl).replace("@FR@", fr))

          # ---------- the two widget bodies (accent colours like the preview) ----------
          for kind, hx in (("dailies", "38BDF8"), ("quests", "FBBF24")):
              w("layout/widget_tasks_%s.xml" % kind, """
          <LinearLayout @NS@
              android:id="@+id/w_root"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:orientation="vertical"
              android:paddingTop="14dp" android:paddingStart="12dp" android:paddingEnd="12dp" android:paddingBottom="12dp"
              android:background="@drawable/widget_card_@K@">
              <LinearLayout android:id="@+id/w_top"
                  android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:orientation="vertical" android:paddingBottom="10dp">
                  <LinearLayout android:id="@+id/w_header"
