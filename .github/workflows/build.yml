                          rv.setTextViewText(R.id.row_streak_n, String.valueOf(streak));
                      } catch (Throwable ignored) {}
                      try { rv.setInt(R.id.row_bar, "setColorFilter", done ? ((color & 0x00FFFFFF) | 0x78000000) : ((color & 0x00FFFFFF) | 0xE0000000)); } catch (Throwable ignored) {}
                      try { rv.setInt(R.id.row_check, "setBackgroundResource", done ? R.drawable.widget_check_box_done : R.drawable.widget_check_box); } catch (Throwable ignored) {}
                      try { rv.setInt(R.id.row_card, "setBackgroundResource", done ? R.drawable.widget_row_done_bg : (urgent ? R.drawable.widget_row_urgent_bg : R.drawable.widget_row_bg)); } catch (Throwable ignored) {}
                      try { rv.setOnClickFillInIntent(R.id.row_card, new Intent()); } catch (Throwable ignored) {}
                      return rv;
                  }

                  @Override public RemoteViews getLoadingView() {
                      return new RemoteViews(ctx.getPackageName(), R.layout.widget_task_item);
                  }
                  @Override public int getViewTypeCount() { return 1; }
                  @Override public long getItemId(int position) { return position; }
                  @Override public boolean hasStableIds() { return false; }
              }
