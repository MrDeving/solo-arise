          package com.hunter.arisesolo.widget;

          import android.content.Context;
          import android.content.SharedPreferences;
          import android.widget.RemoteViews;
          import com.hunter.arisesolo.R;
          import org.json.JSONArray;
          import org.json.JSONObject;

          // Reads the data the web app pushes (group "AriseWidgets", key "tasks").
          final class WidgetData {
              private WidgetData() {}

              static JSONObject load(Context ctx) {
                  try {
                      SharedPreferences p = ctx.getSharedPreferences("AriseWidgets", Context.MODE_PRIVATE);
                      String raw = p.getString("tasks", null);
                      if (raw != null) return new JSONObject(raw);
                  } catch (Exception ignored) {}
                  return new JSONObject();
              }

              // If a widget fails to build, show the reason on the widget itself instead of "Can't load widget".
              static RemoteViews errorViews(Context ctx, Throwable t) {
                  RemoteViews v = new RemoteViews(ctx.getPackageName(), R.layout.widget_error);
                  String msg = String.valueOf(t);
                  if (msg.length() > 220) msg = msg.substring(0, 220);
                  v.setTextViewText(R.id.e_text, "Widget error:\n" + msg);
                  return v;
              }

              // The app's "day" starts at the user's reset time, not always midnight.
              // Returns yyyy-MM-dd of the current app day (same rule the web app uses).
              static String logicalDay(int resetMin) {
                  java.util.Calendar c = java.util.Calendar.getInstance();
                  c.add(java.util.Calendar.MINUTE, -resetMin);
                  return String.format(java.util.Locale.US, "%04d-%02d-%02d",
                      c.get(java.util.Calendar.YEAR), c.get(java.util.Calendar.MONTH) + 1, c.get(java.util.Calendar.DAY_OF_MONTH));
              }

              static JSONArray list(Context ctx, String kind) {
                  JSONArray a = load(ctx).optJSONArray(kind);
                  return a == null ? new JSONArray() : a;
              }
          }
          WEOF

          cat > android/app/src/main/java/com/hunter/arisesolo/widget/TasksWidgetService.java << 'WEOF'
          package com.hunter.arisesolo.widget;

          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Color;
          import android.text.SpannableString;
          import android.text.Spanned;
          import android.text.style.StrikethroughSpan;
          import android.widget.RemoteViews;
          import android.widget.RemoteViewsService;
          import com.hunter.arisesolo.R;
          import org.json.JSONArray;
          import org.json.JSONObject;

          // Feeds the scrollable list inside the Dailies and Quests widgets.
          public class TasksWidgetService extends RemoteViewsService {
              @Override
              public RemoteViewsFactory onGetViewFactory(Intent intent) {
                  return new Factory(getApplicationContext(), intent.getStringExtra("kind"));
              }

              static class Factory implements RemoteViewsService.RemoteViewsFactory {
                  private final Context ctx;
                  private final String kind;
                  private JSONArray items = new JSONArray();

                  Factory(Context c, String k) {
                      ctx = c;
                      kind = (k == null) ? "dailies" : k;
                  }

                  @Override public void onCreate() { onDataSetChanged(); }
                  @Override public void onDestroy() {}

                  @Override
                  public void onDataSetChanged() {
                      // pending tasks first, finished ones (struck through) after
                      JSONArray src = WidgetData.list(ctx, kind);
                      JSONArray out = new JSONArray();
                      for (int pass = 0; pass < 2; pass++) {
                          for (int i = 0; i < src.length(); i++) {
                              JSONObject o = src.optJSONObject(i);
                              if (o == null) continue;
                              boolean done = o.optInt("d", 0) == 1;
                              if ((pass == 0 && !done) || (pass == 1 && done)) out.put(o);
                          }
                      }
                      items = out;
                  }

                  @Override public int getCount() { return items.length(); }

                  @Override
                  public RemoteViews getViewAt(int pos) {
                      RemoteViews rv = new RemoteViews(ctx.getPackageName(), R.layout.widget_task_item);
                      JSONObject o = items.optJSONObject(pos);
                      if (o == null) return rv;
                      boolean done = o.optInt("d", 0) == 1;
                      String title = o.optString("t", "");
                      int color;
                      try { color = Color.parseColor(o.optString("c", "#38bdf8")); }
                      catch (Exception e) { color = 0xFF38BDF8; }

                      // essentials first: the text always shows, nothing below can stop it
                      rv.setTextViewText(R.id.row_title, title);
                      rv.setTextViewText(R.id.row_check, done ? "✔" : "○");

                      // decorations: each one isolated so a single failure can't kill the row
                      try {
                          if (done && title.length() > 0) {
                              SpannableString s = new SpannableString(title);
                              s.setSpan(new StrikethroughSpan(), 0, title.length(), Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);
                              rv.setTextViewText(R.id.row_title, s);
                          }
                      } catch (Throwable ignored) {}
                      try { rv.setTextColor(R.id.row_title, done ? 0xFF64748B : 0xFFE2E8F0); } catch (Throwable ignored) {}
                      try { rv.setTextColor(R.id.row_check, done ? 0xFF4ADE80 : color); } catch (Throwable ignored) {}
                      try { rv.setInt(R.id.row_bar, "setBackgroundColor", done ? ((color & 0x00FFFFFF) | 0x55000000) : color); } catch (Throwable ignored) {}
                      try { rv.setInt(R.id.row_card, "setBackgroundResource", done ? R.drawable.widget_row_done_bg : R.drawable.widget_row_bg); } catch (Throwable ignored) {}
                      try { rv.setOnClickFillInIntent(R.id.row_card, new Intent()); } catch (Throwable ignored) {}
                      return rv;
                  }

                  @Override public RemoteViews getLoadingView() {
                      return new RemoteViews(ctx.getPackageName(), R.layout.widget_task_item);
                  }
                  @Override public int getViewTypeCount() { return 1; }
                  @Override public long getItemId(int position) { return position; }
                  @Override public boolean hasStableIds() { return false; }
              }
          }
          WEOF

