                          android:textSize="15sp" android:textStyle="bold" android:letterSpacing="0.16"
                          android:maxLines="1" android:ellipsize="end" android:fontFamily="@font/rajdhani"
                          android:textColor="#@HX@"/>
                      <TextView android:id="@+id/w_count"
                          android:layout_width="wrap_content" android:layout_height="wrap_content"
                          android:layout_marginStart="8dp" android:background="@drawable/widget_pill_@K@"
                          android:paddingStart="11dp" android:paddingEnd="11dp" android:paddingTop="3dp" android:paddingBottom="3dp"
                          android:maxLines="1" android:textSize="12sp" android:textStyle="bold" android:letterSpacing="0.08"
                          android:fontFamily="@font/rajdhani" android:textColor="#F1F7FB"/>
                  </LinearLayout>
                  <ProgressBar android:id="@+id/w_bar" style="?android:attr/progressBarStyleHorizontal"
                      android:layout_width="match_parent" android:layout_height="4dp"
                      android:layout_marginTop="10dp" android:layout_marginStart="4dp" android:layout_marginEnd="4dp"
                      android:minHeight="4dp" android:maxHeight="4dp" android:max="100" android:progress="0"
                      android:indeterminate="false" android:progressDrawable="@drawable/widget_bar_dailies"/>
              </LinearLayout>
              <FrameLayout android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1">
                  <ListView android:id="@+id/w_list"
                      android:layout_width="match_parent" android:layout_height="match_parent"
                      android:divider="@null" android:dividerHeight="0dp"
                      android:listSelector="@android:color/transparent" android:cacheColorHint="@android:color/transparent"
                      android:clipToPadding="false" android:paddingTop="2dp" android:paddingBottom="4dp" android:paddingEnd="4dp" android:overScrollMode="never"
                      android:scrollbars="vertical" android:fadeScrollbars="false" android:scrollbarSize="3dp"
