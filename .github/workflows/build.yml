          cat > android/app/src/main/java/com/hunter/arisesolo/widget/WidgetActionActivity.java << 'WEOF'
          package com.hunter.arisesolo.widget;

          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import org.json.JSONArray;
          import org.json.JSONObject;

          // Invisible stop for every widget tap: opens the app on the right tab, ticks a task, ticks a checklist
          // item, or drops a checklist down. It finishes immediately, so the user never sees it.
          public class WidgetActionActivity extends Activity {
              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  try { handle(getIntent()); } catch (Throwable ignored) {}
                  finish();
                  overridePendingTransition(0, 0);
              }

              private void handle(Intent in) throws Exception {
                  if (in == null) return;
                  String act = in.getStringExtra("act");
                  String kind = in.getStringExtra("kind");
                  if (act == null || kind == null) return;
                  if ("open".equals(act)) { openApp(kind); return; }
                  if ("dualtab".equals(act)) { dualTab(kind, in.getIntExtra("wid", -1)); return; }

                  String tid = in.getStringExtra("tid");
                  int j = in.getIntExtra("j", -1);
                  if (tid == null || tid.length() == 0) {
                      android.widget.Toast.makeText(getApplicationContext(), "Widget: no task id received. Open the app once and try again.", android.widget.Toast.LENGTH_LONG).show();
                      return;
                  }

                  if ("exp".equals(act)) {
                      WidgetData.toggleExpanded(this, kind + ":" + tid);
                      TasksWidgetBase.refreshAll(this);
                      return;
                  }

                  JSONObject d = WidgetData.load(this);
                  JSONArray arr = d.optJSONArray(kind);
                  if (arr == null) return;
                  boolean hit = false;
                  for (int i = 0; i < arr.length(); i++) {
                      JSONObject o = arr.optJSONObject(i);
                      if (o == null || !tid.equals(o.optString("i", ""))) continue;
                      hit = true;
                      JSONObject q = new JSONObject();
                      q.put("id", tid);
                      if ("task".equals(act)) {
                          int nd = (o.optInt("d", 0) == 1) ? 0 : 1;
                          q.put("t", "task");
                          q.put("d", nd);
                          if ("quests".equals(kind) && nd == 1) arr.remove(i);   // a finished quest leaves the list, like in the app
                          else o.put("d", nd);
                      } else if ("cl".equals(act)) {
                          JSONArray cl = o.optJSONArray("cl");
                          JSONArray c = (cl == null || j < 0) ? null : cl.optJSONArray(j);
                          if (c == null) return;
                          int nd = (c.optInt(1, 0) == 1) ? 0 : 1;
                          c.put(1, nd);
                          q.put("t", "cl");
                          q.put("j", j);
                          q.put("d", nd);
                      } else {
                          return;
                      }
                      WidgetData.queue(this, q);   // the app applies it (XP, streak, sounds) next time it opens
                      WidgetData.save(this, d);
                      break;
                  }
                  if (!hit) android.widget.Toast.makeText(getApplicationContext(), "Widget: task not found. Open the app once to refresh it.", android.widget.Toast.LENGTH_LONG).show();
                  TasksWidgetBase.refreshAll(this);
              }

              private void dualTab(String tab, int wid) {
                  if (wid == -1) return;
                  android.content.SharedPreferences p = getSharedPreferences("AriseWidgets", MODE_PRIVATE);
                  long now = System.currentTimeMillis();
                  long last = p.getLong("duallast_" + wid, 0L);
                  String lastTab = p.getString("duallasttab_" + wid, "");
                  if (tab.equals(lastTab) && now - last < 700) {   // quick second tap on the same tab: open the app on that section
                      p.edit().remove("duallast_" + wid).apply();
                      openApp(tab);
                      return;
                  }
                  p.edit().putString("dualtab_" + wid, tab).putLong("duallast_" + wid, now).putString("duallasttab_" + wid, tab).apply();
                  DualTasksWidget.refresh(this, wid);
              }
              private void openApp(String kind) {
                  String tab = "quests".equals(kind) ? "quests" : ("calendar".equals(kind) ? "analytics" : "home");
                  WidgetData.setOpenTab(this, tab);
                  Intent i = getPackageManager().getLaunchIntentForPackage(getPackageName());
                  if (i == null) return;
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED);
                  startActivity(i);
              }
          }
