      - name: Create Calendar widget Java
        run: |
          cat > android/app/src/main/java/com/hunter/arisesolo/widget/EthCalendarWidget.java << 'WEOF'
          package com.hunter.arisesolo.widget;

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.PorterDuff;
          import android.graphics.PorterDuffXfermode;
          import android.graphics.RectF;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.View;
          import android.widget.RemoteViews;
          import android.widget.Toast;
          import com.hunter.arisesolo.R;
          import java.util.Calendar;
          import org.json.JSONArray;
          import org.json.JSONObject;

          // Calendar widget: same Ethiopian calendar as the app, week by week.
          // Height decides how many weeks show (min 1). Arrows page through weeks.
          public class EthCalendarWidget extends AppWidgetProvider {
              static final String ACT_PREV  = "com.hunter.arisesolo.widget.ECAL_PREV";
              static final String ACT_NEXT  = "com.hunter.arisesolo.widget.ECAL_NEXT";
              static final String ACT_TODAY = "com.hunter.arisesolo.widget.ECAL_TODAY";
              static final String ACT_CELL  = "com.hunter.arisesolo.widget.ECAL_CELL";
              static final String PREFS = "EthCalWidget";
              static final int MAX_ROWS = 6;
              static final String[] ETH_MONTHS = {"","መስከረም","ጥቅምት","ህዳር","ታህሳስ","ጥር","የካቲት","መጋቢት","ሚያዝያ","ግንቦት","ሰኔ","ሐምሌ","ነሐሴ","ጳጉሜ"};

              @Override
              public void onUpdate(Context ctx, AppWidgetManager mgr, int[] ids) {
                  for (int id : ids) safeRender(ctx, mgr, id);
              }

              @Override
              public void onAppWidgetOptionsChanged(Context ctx, AppWidgetManager mgr, int id, Bundle o) {
                  safeRender(ctx, mgr, id);
              }

              @Override
              public void onDeleted(Context ctx, int[] ids) {
                  SharedPreferences.Editor ed = ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit();
                  for (int id : ids) ed.remove("off_" + id);
                  ed.apply();
              }

              @Override
              public void onReceive(Context ctx, Intent intent) {
                  if (intent == null) return;
                  String a = intent.getAction();
                  AppWidgetManager mgr = AppWidgetManager.getInstance(ctx);
                  if (ACT_PREV.equals(a) || ACT_NEXT.equals(a) || ACT_TODAY.equals(a)) {
                      int id = intent.getIntExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, AppWidgetManager.INVALID_APPWIDGET_ID);
                      if (id == AppWidgetManager.INVALID_APPWIDGET_ID) return;
                      SharedPreferences p = ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
                      int off = p.getInt("off_" + id, 0);
                      if (ACT_TODAY.equals(a)) off = 0;
                      else off += ACT_NEXT.equals(a) ? rowsFor(mgr, id) : -rowsFor(mgr, id);
                      p.edit().putInt("off_" + id, off).apply();
                      safeRender(ctx, mgr, id);
                      return;
                  }
                  if (ACT_CELL.equals(a)) {
                      String label = intent.getStringExtra("label");
                      String titles = intent.getStringExtra("titles");
                      String msg = (titles != null && !titles.isEmpty()) ? label + "\n" + titles : label + " — No events";
                      Toast.makeText(ctx, msg, Toast.LENGTH_LONG).show();
                      return;
                  }
                  if (Intent.ACTION_DATE_CHANGED.equals(a) || Intent.ACTION_TIME_CHANGED.equals(a) || Intent.ACTION_TIMEZONE_CHANGED.equals(a)) {
                      for (int id : mgr.getAppWidgetIds(new ComponentName(ctx, EthCalendarWidget.class))) safeRender(ctx, mgr, id);
                      return;
                  }
                  super.onReceive(ctx, intent);
              }

              static void safeRender(Context ctx, AppWidgetManager mgr, int id) {
                  try {
                      render(ctx, mgr, id);
                  } catch (Throwable t) {
                      try { mgr.updateAppWidget(id, WidgetData.errorViews(ctx, t)); } catch (Throwable ignored) {}
                  }
              }

              // Weeks that fit the widget's height (always at least the current week)
              static int rowsFor(AppWidgetManager mgr, int id) {
                  Bundle o = mgr.getAppWidgetOptions(id);
                  int h = (o == null) ? 0 : o.getInt(AppWidgetManager.OPTION_APPWIDGET_MIN_HEIGHT, 0);
                  if (h <= 0) return 1;
                  float slot = (o.getInt(AppWidgetManager.OPTION_APPWIDGET_MIN_WIDTH, 250) - 32f) / 7f;
                  return Math.max(1, Math.min(MAX_ROWS, (int) ((h - 106f) / slot)));
              }

              // ---- Ethiopian date maths (same anchor as the app: 2018-6-2 == 9 Feb 2026, a Monday) ----
              static int dim(int y, int m) { return m == 13 ? (y % 4 == 3 ? 6 : 5) : 30; }

              static long ord(int y, int m, int d) { return 365L * y + y / 4 + (m - 1) * 30 + (d - 1); }

              // 0 = Monday ... 6 = Sunday
              static int weekday(int y, int m, int d) {
                  long delta = ord(y, m, d) - ord(2018, 6, 2);
                  return (int) (((delta % 7) + 7) % 7);
              }

              static int[] addDays(int y, int m, int d, int n) {
                  d += n;
                  while (d > dim(y, m)) { d -= dim(y, m); m++; if (m > 13) { m = 1; y++; } }
                  while (d < 1) { m--; if (m < 1) { m = 13; y--; } d += dim(y, m); }
                  return new int[] { y, m, d };
              }

              static int[] today() {
                  Calendar c = Calendar.getInstance();
                  c.set(Calendar.HOUR_OF_DAY, 0); c.set(Calendar.MINUTE, 0); c.set(Calendar.SECOND, 0); c.set(Calendar.MILLISECOND, 0);
                  Calendar a = Calendar.getInstance();
                  a.set(2026, Calendar.FEBRUARY, 9, 0, 0, 0); a.set(Calendar.MILLISECOND, 0);
                  long diff = Math.round((c.getTimeInMillis() - a.getTimeInMillis()) / 86400000.0);
                  return addDays(2018, 6, 2, (int) diff);
              }

              static boolean hit(JSONObject ev, int[] dt) {
                  String rec = ev.optString("recurrence", "yearly");
                  int d = ev.optInt("day"), m = ev.optInt("month"), y = ev.optInt("year", 0);
                  if ("monthly".equals(rec)) return d == dt[2];
                  if ("once".equals(rec)) return d == dt[2] && m == dt[1] && y == dt[0];
                  return d == dt[2] && m == dt[1];
              }
              // Approx. size of one day tile in dp, so the pie slices get the same proportions as in the app
              static float[] cellDp(AppWidgetManager mgr, int id, int rows) {
                  Bundle o = mgr.getAppWidgetOptions(id);
                  float w = (o == null) ? 250f : o.getInt(AppWidgetManager.OPTION_APPWIDGET_MIN_WIDTH, 250);
                  float h = (o == null) ? 110f : o.getInt(AppWidgetManager.OPTION_APPWIDGET_MIN_HEIGHT, 110);
                  return new float[] { Math.max(16f, (w - 32f) / 7f), Math.max(16f, (h - 100f) / rows) };
              }

              // One day tile drawn with the same rules as the HTML preview
              static Bitmap cellBitmap(int[] cols, int n, boolean today, int accent, float wDp, float hDp) {
                  float k = 96f / Math.max(wDp, hDp);
                  int w = Math.max(24, Math.round(wDp * k)), h = Math.max(24, Math.round(hDp * k));
                  Bitmap bmp = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888);
                  Canvas cv = new Canvas(bmp);
                  Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
                  float g = 3f * k, r = 12f * k;
                  float bw = ((n > 1 && !today) ? 2f : 1f) * k;
                  RectF tile = new RectF(g, g, w - g, h - g);
                  if (n == 0) {
                      p.setColor(Color.argb(153, 15, 23, 42));
                      cv.drawRoundRect(tile, r, r, p);
                  } else if (n == 1) {
                      p.setColor((cols[0] & 0x00FFFFFF) | 0x40000000);
                      cv.drawRoundRect(tile, r, r, p);
                  } else {
                      Bitmap pie = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888);
                      Canvas pc = new Canvas(pie);
                      Paint pp = new Paint(Paint.ANTI_ALIAS_FLAG);
                      float big = (float) Math.hypot(w, h);
                      RectF oval = new RectF(w / 2f - big, h / 2f - big, w / 2f + big, h / 2f + big);
                      float sweep = 360f / n;
                      for (int i = 0; i < n; i++) {
                          pp.setColor(cols[i]);
                          pc.drawArc(oval, -90f + i * sweep, (i < n - 1) ? sweep + 0.6f : sweep, true, pp);
                      }
                      p.setShader(new android.graphics.BitmapShader(pie, android.graphics.Shader.TileMode.CLAMP, android.graphics.Shader.TileMode.CLAMP));
                      cv.drawRoundRect(tile, r, r, p);
                      p.setShader(null);
                  }
                  p.setStyle(Paint.Style.STROKE);
                  p.setStrokeWidth(bw);
                  p.setColor(n == 1 ? (cols[0] | 0xFF000000) : Color.argb(31, 255, 255, 255));
                  cv.drawRoundRect(new RectF(tile.left + bw / 2f, tile.top + bw / 2f, tile.right - bw / 2f, tile.bottom - bw / 2f), r - bw / 2f, r - bw / 2f, p);
                  if (today) {
                      float o = 1.75f * k;
                      p.setStrokeWidth(1.5f * k);
                      p.setColor(accent);
                      cv.drawRoundRect(new RectF(tile.left - o, tile.top - o, tile.right + o, tile.bottom + o), r + o, r + o, p);
                      p.setStyle(Paint.Style.FILL);
                      Paint tp = new Paint(Paint.ANTI_ALIAS_FLAG);
                      tp.setTypeface(android.graphics.Typeface.DEFAULT_BOLD);
                      tp.setTextSize(8f * k);
                      tp.setLetterSpacing(0.1f);
                      float tw = tp.measureText("TODAY");
                      float tagW = 18f * k + tw, tagH = 14f * k, tx = (w - tagW) / 2f;
                      cv.drawRoundRect(new RectF(tx, 0, tx + tagW, tagH), 4f * k, 4f * k, p);
                      cv.save();
                      cv.translate(w / 2f, tagH);
                      cv.rotate(45f);
                      cv.drawRoundRect(new RectF(-3f * k, -3f * k, 3f * k, 3f * k), k, k, p);
                      cv.restore();
                      Paint dot = new Paint(Paint.ANTI_ALIAS_FLAG);
                      dot.setColor(Color.argb(140, 4, 16, 29));
                      cv.drawCircle(tx + 6f * k, tagH / 2f, 2f * k, dot);
                      tp.setColor(0xFF04101D);
                      Paint.FontMetrics fm = tp.getFontMetrics();
                      cv.drawText("TODAY", tx + 12f * k, tagH / 2f - (fm.ascent + fm.descent) / 2f, tp);
                  }
                  return bmp;
              }

              // Same look as the app's conic-gradient: equal slices from 12 o'clock, clockwise, on a rounded tile
              static Bitmap pieBitmap(int[] cols, int n, float wDp, float hDp) {
                  float k = 96f / Math.max(wDp, hDp);
                  int w = Math.max(24, Math.round(wDp * k)), h = Math.max(24, Math.round(hDp * k));
                  Bitmap bmp = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888);
                  Canvas cv = new Canvas(bmp);
                  Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
                  float big = (float) Math.hypot(w, h);
                  RectF oval = new RectF(w / 2f - big, h / 2f - big, w / 2f + big, h / 2f + big);
                  float sweep = 360f / n;
                  for (int i = 0; i < n; i++) {
                      p.setColor(cols[i]);
                      cv.drawArc(oval, -90f + i * sweep, (i < n - 1) ? sweep + 0.6f : sweep, true, p);
                  }
                  Paint mask = new Paint(Paint.ANTI_ALIAS_FLAG);
                  mask.setXfermode(new PorterDuffXfermode(PorterDuff.Mode.DST_IN));
                  float r = 11f * k;
                  cv.drawRoundRect(new RectF(0, 0, w, h), r, r, mask);
                  return bmp;
              }
              static int parse(String s, int fallback) {
                  try { return Color.parseColor(s) | 0xFF000000; } catch (Throwable t) { return fallback; }
              }

              static JSONObject loadData(Context ctx) {
                  try {
                      String raw = ctx.getSharedPreferences("CapacitorStorage", Context.MODE_PRIVATE).getString("widget_data", null);
                      if (raw != null) return new JSONObject(raw);
                  } catch (Throwable ignored) {}
                  return new JSONObject();
              }

              static PendingIntent nav(Context ctx, int id, String action) {
                  Intent i = new Intent(ctx, EthCalendarWidget.class).setAction(action);
                  i.putExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, id);
                  i.setData(Uri.parse("ecal://nav/" + id + "/" + action));
                  return PendingIntent.getBroadcast(ctx, 0, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }

              static void render(Context ctx, AppWidgetManager mgr, int id) {
                  RemoteViews v = new RemoteViews(ctx.getPackageName(), R.layout.widget_ecal);
                  JSONObject data = loadData(ctx);
                  JSONArray events = data.optJSONArray("events");
                  if (events == null) events = new JSONArray();
                  int accent = parse(data.optString("accent", "#38bdf8"), 0xFF38BDF8);
                  int rows = rowsFor(mgr, id);
                  int off = ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE).getInt("off_" + id, 0);

                  int[] t = today();
                  int[] ws = addDays(t[0], t[1], t[2], off * 7 - weekday(t[0], t[1], t[2]));  // Monday of the first shown week
                  int[] mid = addDays(ws[0], ws[1], ws[2], 3);                                // label = month of that week's Thursday

                  v.setTextViewText(R.id.ec_month, ETH_MONTHS[mid[1]]);
                  v.setTextColor(R.id.ec_month, accent);
                  v.setTextViewText(R.id.ec_monthnum, String.valueOf(mid[1]));
                  v.setTextViewText(R.id.ec_year, String.valueOf(mid[0]));
                  v.setInt(R.id.ec_pill, "setColorFilter", accent);
                  v.setInt(R.id.ec_pill, "setImageAlpha", 46);
                  v.setInt(R.id.ec_pillring, "setColorFilter", accent);
                  v.setOnClickPendingIntent(R.id.ec_prev, nav(ctx, id, ACT_PREV));
                  v.setOnClickPendingIntent(R.id.ec_next, nav(ctx, id, ACT_NEXT));
                  v.setOnClickPendingIntent(R.id.ec_center, nav(ctx, id, ACT_TODAY));
                  v.setOnClickPendingIntent(R.id.ec_today, nav(ctx, id, ACT_TODAY));
                  v.setInt(R.id.ec_today, "setColorFilter", accent);

                  int[] rowIds = { R.id.ec_row0, R.id.ec_row1, R.id.ec_row2, R.id.ec_row3, R.id.ec_row4, R.id.ec_row5 };
                  android.content.res.Resources res = ctx.getResources();
                  String pkg = ctx.getPackageName();
                  float[] cd = cellDp(mgr, id, rows);
                  java.util.HashMap<String, Bitmap> cache = new java.util.HashMap<>();

                  for (int r = 0; r < MAX_ROWS; r++) {
                      boolean on = r < rows;
                      v.setViewVisibility(rowIds[r], on ? View.VISIBLE : View.GONE);
                      if (!on) continue;
                      for (int c = 0; c < 7; c++) {
                          int i = r * 7 + c;
                          int[] dt = addDays(ws[0], ws[1], ws[2], i);
                          int cell = res.getIdentifier("ec_c" + i, "id", pkg);
                          int fill = res.getIdentifier("ec_f" + i, "id", pkg);
                          int ring = res.getIdentifier("ec_r" + i, "id", pkg);
                          int txt  = res.getIdentifier("ec_t" + i, "id", pkg);
                          if (cell == 0 || fill == 0 || ring == 0 || txt == 0) continue;

                          boolean isToday = dt[0] == t[0] && dt[1] == t[1] && dt[2] == t[2];
                          boolean inMonth = dt[0] == mid[0] && dt[1] == mid[1];

                          String titles = "";
                          int count = 0, first = accent;
                          int[] cols = new int[events.length()];
                          for (int e = 0; e < events.length(); e++) {
                              JSONObject ev = events.optJSONObject(e);
                              if (ev == null || !hit(ev, dt)) continue;
                              cols[count] = parse(ev.optString("color", "#8b5cf6"), 0xFF38BDF8);
                              if (count == 0) first = cols[count];
                              titles += (count == 0 ? "" : "\n") + "• " + ev.optString("title", "");
                              count++;
                          }

                          // same rules as the app's calendar tiles
                          int fillColor = 0xFFFFFFFF, fillAlpha = 12;   // plain day: rgba(255,255,255,0.045)
                          int ringColor = 0xFFFFFFFF, ringAlpha = 31;   // plain border: rgba(255,255,255,0.12)
                          int ringRes = R.drawable.ecal_ring;
                          boolean pie = count > 1;
                          if (count == 1) {                             // one event: its color at 25% + solid border in its color
                              fillColor = first; fillAlpha = 64;
                              ringColor = first; ringAlpha = 255;
                          } else if (pie) {                             // overlapping events: equal color slices, thicker soft border
                              ringRes = R.drawable.ecal_ring2;
                          }
                          if (isToday) { ringColor = accent; ringAlpha = 255; ringRes = R.drawable.ecal_ring2; }

                          String key = (isToday ? "T" : "N") + count + (count > 1 ? java.util.Arrays.toString(java.util.Arrays.copyOf(cols, count)) : (count == 1 ? Integer.toHexString(first) : ""));
                          Bitmap cb = cache.get(key);
                          if (cb == null) { cb = cellBitmap(cols, count, isToday, accent, cd[0], cd[1]); cache.put(key, cb); }
                          v.setImageViewBitmap(fill, cb);
                          v.setViewVisibility(ring, View.GONE);
                          v.setViewPadding(txt, 0, isToday ? (int) (6 * res.getDisplayMetrics().density) : 0, 0, 0);
                          v.setTextViewText(txt, String.valueOf(dt[2]));
                          v.setTextColor(txt, (count > 0 || isToday) ? 0xFFFFFFFF : (inMonth ? 0xFFF1F7FB : 0x66F1F7FB));

                          Intent ci = new Intent(ctx, EthDayActivity.class);
                          ci.putExtra("label", ETH_MONTHS[dt[1]] + " " + dt[2] + ", " + dt[0]);
                          ci.putExtra("titles", titles);
                          ci.setData(Uri.parse("ecal://cell/" + id + "/" + i));
                          v.setOnClickPendingIntent(cell, PendingIntent.getActivity(ctx, 0, ci,
                              PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE));
                      }
                  }
                  mgr.updateAppWidget(id, v);
              }
          }
          WEOF

      - name: Create Calendar day dialog Java
        run: |
          cat > android/app/src/main/java/com/hunter/arisesolo/widget/EthDayActivity.java << 'WEOF'
          package com.hunter.arisesolo.widget;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.os.Bundle;

          public class EthDayActivity extends Activity {
              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  String label = getIntent().getStringExtra("label");
                  String titles = getIntent().getStringExtra("titles");
                  new AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                      .setTitle(label)
                      .setMessage((titles != null && !titles.isEmpty()) ? titles : "No events")
                      .setPositiveButton("OK", null)
                      .setOnDismissListener(d -> finish())
                      .show();
              }
          }
          WEOF

      - name: Register Calendar widget in AndroidManifest
        run: |
          python3 << 'PYEOF'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          block = ('    <receiver android:name="com.hunter.arisesolo.widget.EthCalendarWidget" android:exported="true" android:label="Calendar">'
                   '<intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/>'
                   '<action android:name="android.intent.action.DATE_CHANGED"/>'
                   '<action android:name="android.intent.action.TIME_SET"/>'
                   '<action android:name="android.intent.action.TIMEZONE_CHANGED"/></intent-filter>'
                   '<meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_ecal_info"/></receiver>\n'
                   '    <activity android:name="com.hunter.arisesolo.widget.EthDayActivity" android:exported="false" android:theme="@android:style/Theme.Translucent.NoTitleBar" android:excludeFromRecents="true" android:taskAffinity=""/>\n')
          assert "</application>" in s
          s = s.replace("</application>", block + "</application>", 1)
          open(p, "w", encoding="utf-8").write(s)
          print("calendar widget registered")
          PYEOF

      - name: Inject Exact Alarm Permissions
        run: |
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />' android/app/src/main/AndroidManifest.xml

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/my-release-key.jks

      - name: Build APK
        working-directory: ./android
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/my-release-key.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEY_STORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=my-key-alias \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Arisesolo-APK
          path: android/app/build/outputs/apk/release/app-release.apk