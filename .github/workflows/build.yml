                          </FrameLayout>
                          <TextView android:id="@+id/r0t"
                              android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1"
                              android:minHeight="44dp" android:gravity="center_vertical"
                              android:paddingStart="12dp" android:paddingEnd="12dp" android:paddingTop="10dp" android:paddingBottom="10dp"
                              android:maxLines="2" android:ellipsize="end"
                              android:fontFamily="sans-serif-medium" android:textSize="14sp" android:textColor="#FFFFFF"/>
                      </LinearLayout>
                      <LinearLayout android:id="@+id/r1"
                          android:layout_width="match_parent" android:layout_height="wrap_content"
                          android:orientation="horizontal" android:gravity="center_vertical"
                          android:layout_marginBottom="6dp" android:background="@drawable/widget_row_bg"
                          android:visibility="gone">
                          <FrameLayout android:layout_width="44dp" android:layout_height="match_parent">
                              <ImageView android:id="@+id/r1s"
                                  android:layout_width="match_parent" android:layout_height="match_parent"
                                  android:scaleType="fitXY" android:src="@drawable/widget_slab"/>
                              <TextView android:id="@+id/r1m"
                                  android:layout_width="24dp" android:layout_height="24dp"
                                  android:layout_gravity="center" android:gravity="center"
                                  android:background="@drawable/widget_check_box"
                                  android:textSize="14sp" android:textStyle="bold" android:textColor="#F2FFFFFF"/>
