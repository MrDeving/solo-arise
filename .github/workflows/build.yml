          package com.hunter.arisesolo;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import androidx.core.content.ContextCompat;

          // Fired by AlarmManager at the reminder time: hands over to the ringing service.
          public class AlarmReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context ctx, Intent in) {
                  try {
                      Intent s = new Intent(ctx, AlarmService.class);
                      s.setAction(AlarmService.ACTION_RING);
                      if (in != null && in.getExtras() != null) s.putExtras(in.getExtras());
                      ContextCompat.startForegroundService(ctx, s);
                  } catch (Throwable ignored) {}
              }
          }
