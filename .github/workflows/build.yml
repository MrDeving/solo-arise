              a('        <TextView android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:gravity="center" android:text="%s" android:textSize="12sp" android:textStyle="bold" android:textColor="#9FB3C8"/>' % ch)
          a('    </LinearLayout>')
          # 6 week rows x 7 cells (rows are shown/hidden by widget height)
          for r in range(6):
              a('    <LinearLayout android:id="@+id/ec_row%d" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:orientation="horizontal">' % r)
              for c in range(7):
                  i = r * 7 + c
                  a('        <FrameLayout android:id="@+id/ec_c%d" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:layout_margin="0dp">' % i)
                  a('            <ImageView android:id="@+id/ec_f%d" android:layout_width="match_parent" android:layout_height="match_parent" android:scaleType="fitCenter" android:src="@drawable/ecal_fill"/>' % i)
                  a('            <ImageView android:id="@+id/ec_r%d" android:layout_width="match_parent" android:layout_height="match_parent" android:scaleType="fitXY" android:src="@drawable/ecal_ring"/>' % i)
                  a('            <TextView android:id="@+id/ec_t%d" android:layout_width="match_parent" android:layout_height="match_parent" android:gravity="center" android:maxLines="1" android:textSize="14sp" android:textStyle="bold" android:textColor="#F1F7FB" android:shadowColor="#CC000000" android:shadowRadius="4"/>' % i)
                  a('        </FrameLayout>')
              a('    </LinearLayout>')
          a('</LinearLayout>')
          open("android/app/src/main/res/layout/widget_ecal.xml", "w", encoding="utf-8").write("\n".join(L))
