                          android:fontFamily="@font/rajdhani" android:textColor="#38BDF8"/>
                      <TextView android:id="@+id/w_count"
                          android:layout_width="wrap_content" android:layout_height="wrap_content"
                          android:layout_marginStart="8dp"
                          android:background="@drawable/widget_pill_bg"
                          android:paddingStart="10dp" android:paddingEnd="10dp" android:paddingTop="4dp" android:paddingBottom="4dp"
                          android:maxLines="1" android:textSize="12sp" android:textStyle="bold" android:letterSpacing="0.08"
                          android:fontFamily="@font/rajdhani" android:textColor="#9FB3C8"/>
                  </LinearLayout>
                  <ProgressBar android:id="@+id/w_bar" style="?android:attr/progressBarStyleHorizontal"
                      android:layout_width="match_parent" android:layout_height="4dp"
                      android:layout_marginTop="8dp" android:layout_marginStart="2dp" android:layout_marginEnd="2dp"
                      android:minHeight="4dp" android:maxHeight="4dp" android:max="100" android:progress="0"
                      android:indeterminate="false" android:progressDrawable="@drawable/widget_bar_progress"/>
              </LinearLayout>
              <FrameLayout android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1">
                  <LinearLayout android:id="@+id/w_rows"
                      android:layout_width="match_parent" android:layout_height="match_parent"
                      android:orientation="vertical">
                      <LinearLayout android:id="@+id/r0"
                          android:layout_width="match_parent" android:layout_height="wrap_content"
                          android:orientation="horizontal" android:gravity="center_vertical"
                          android:layout_marginBottom="6dp" android:background="@drawable/widget_row_bg"
                          android:visibility="gone">
                          <FrameLayout android:layout_width="44dp" android:layout_height="match_parent">
                              <ImageView android:id="@+id/r0s"
