          cat > android/app/src/main/java/com/hunter/arisesolo/widget/StreakWidget.java << 'WEOF'
          package com.hunter.arisesolo.widget;

          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.Context;
          import android.os.Bundle;
          import android.widget.RemoteViews;
          import com.hunter.arisesolo.R;
          import org.json.JSONObject;

          // Streak widget: switches between a compact and a full layout depending on its size.
          public class StreakWidget extends AppWidgetProvider {
              @Override
              public void onUpdate(Context ctx, AppWidgetManager mgr, int[] ids) {
                  for (int id : ids) safeRender(ctx, mgr, id);
              }

              @Override
              public void onAppWidgetOptionsChanged(Context ctx, AppWidgetManager mgr, int id, Bundle newOptions) {
                  safeRender(ctx, mgr, id);
              }

              private static void safeRender(Context ctx, AppWidgetManager mgr, int id) {
                  try {
                      render(ctx, mgr, id);
                  } catch (Throwable t) {
                      try { mgr.updateAppWidget(id, WidgetData.errorViews(ctx, t)); } catch (Throwable ignored) {}
                  }
              }

              private static void render(Context ctx, AppWidgetManager mgr, int id) {
                  JSONObject d = WidgetData.load(ctx);
                  int streak = d.optInt("streak", 0);
                  boolean claimed = d.optBoolean("claimed", false);

                  Bundle o = mgr.getAppWidgetOptions(id);
                  int w = (o == null) ? 0 : o.getInt(AppWidgetManager.OPTION_APPWIDGET_MIN_WIDTH, 0);
                  int h = (o == null) ? 0 : o.getInt(AppWidgetManager.OPTION_APPWIDGET_MIN_HEIGHT, 0);
                  boolean small = (w > 0 && w < 140) || (h > 0 && h < 100);

                  RemoteViews v = new RemoteViews(ctx.getPackageName(), small ? R.layout.widget_streak_small : R.layout.widget_streak);
                  int color = claimed ? 0xFFFBBF24 : 0xFF64748B;
                  v.setTextViewText(R.id.s_number, String.valueOf(streak));
                  v.setTextColor(R.id.s_number, color);
                  if (!small) {
                      v.setTextViewText(R.id.s_label, streak == 1 ? "DAY STREAK" : "DAYS STREAK");
                      v.setTextColor(R.id.s_label, color);
                      v.setTextViewText(R.id.s_status, claimed ? "SECURED TODAY ✔" : "DO A DAILY TO KEEP IT");
                      v.setTextColor(R.id.s_status, claimed ? 0xFF4ADE80 : 0xFF94A3B8);
                  }
                  v.setOnClickPendingIntent(R.id.s_root, TasksWidgetBase.openApp(ctx));
                  mgr.updateAppWidget(id, v);
              }
          }
          WEOF

          cat > android/app/src/main/java/com/hunter/arisesolo/widget/TasksWidgetBase.java << 'WEOF'
          package com.hunter.arisesolo.widget;

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.text.SpannableString;
          import android.text.Spanned;
          import android.text.style.ForegroundColorSpan;
          import android.text.style.StrikethroughSpan;
          import android.view.View;
          import android.widget.RemoteViews;
          import com.hunter.arisesolo.R;
          import org.json.JSONArray;
          import org.json.JSONObject;

          // Shared logic for the Dailies and Quests widgets.
          // As many task rows are shown as fit the widget's current height, so resizing just works.
          public abstract class TasksWidgetBase extends AppWidgetProvider {
              private static final int[] ROW = {R.id.r_0, R.id.r_1, R.id.r_2, R.id.r_3, R.id.r_4, R.id.r_5, R.id.r_6, R.id.r_7, R.id.r_8, R.id.r_9, R.id.r_10, R.id.r_11};
              private static final int[] BAR = {R.id.rb_0, R.id.rb_1, R.id.rb_2, R.id.rb_3, R.id.rb_4, R.id.rb_5, R.id.rb_6, R.id.rb_7, R.id.rb_8, R.id.rb_9, R.id.rb_10, R.id.rb_11};
              private static final int[] TXT = {R.id.rt_0, R.id.rt_1, R.id.rt_2, R.id.rt_3, R.id.rt_4, R.id.rt_5, R.id.rt_6, R.id.rt_7, R.id.rt_8, R.id.rt_9, R.id.rt_10, R.id.rt_11};

              abstract String kind();
              abstract String title();
              abstract int accent();
              abstract String emptyText();

              @Override
              public void onUpdate(Context ctx, AppWidgetManager mgr, int[] ids) {
                  for (int id : ids) safeRender(ctx, mgr, id);
              }

              // Called while the user drags the resize handles
              @Override
              public void onAppWidgetOptionsChanged(Context ctx, AppWidgetManager mgr, int id, Bundle newOptions) {
                  safeRender(ctx, mgr, id);
              }

              private void safeRender(Context ctx, AppWidgetManager mgr, int id) {
                  try {
                      render(ctx, mgr, id);
                  } catch (Throwable t) {
                      try { mgr.updateAppWidget(id, WidgetData.errorViews(ctx, t)); } catch (Throwable ignored) {}
                  }
              }

              private void render(Context ctx, AppWidgetManager mgr, int id) {
                  RemoteViews v = new RemoteViews(ctx.getPackageName(), R.layout.widget_tasks);

                  // pending first, finished after
                  JSONArray src = WidgetData.list(ctx, kind());
                  JSONObject[] items = new JSONObject[src.length()];
                  int n = 0, done = 0;
                  for (int pass = 0; pass < 2; pass++) {
                      for (int i = 0; i < src.length(); i++) {
                          JSONObject o = src.optJSONObject(i);
                          if (o == null) continue;
                          boolean d = o.optInt("d", 0) == 1;
                          if ((pass == 0 && !d) || (pass == 1 && d)) { items[n++] = o; if (d) done++; }
                      }
                  }

                  // header
                  String count = "";
                  int countColor = 0xFF94A3B8;
                  if (n > 0) {
                      if ("dailies".equals(kind())) {
                          if (done == n) { count = "ALL DONE \u2714"; countColor = 0xFF4ADE80; }
                          else count = done + "/" + n;
                      } else {
                          count = String.valueOf(n);
                      }
                  }
                  v.setTextViewText(R.id.w_title, title());
                  v.setTextColor(R.id.w_title, accent());
                  v.setTextViewText(R.id.w_count, count);
                  v.setTextColor(R.id.w_count, countColor);

                  // how many rows fit?
                  Bundle o = mgr.getAppWidgetOptions(id);
                  int hDp = 0;
                  if (o != null) {
                      hDp = o.getInt(AppWidgetManager.OPTION_APPWIDGET_MAX_HEIGHT, 0);
                      if (hDp <= 0) hDp = o.getInt(AppWidgetManager.OPTION_APPWIDGET_MIN_HEIGHT, 0);
                  }
                  if (hDp <= 0) hDp = 180;
                  boolean showHeader = hDp >= 90;
                  v.setViewVisibility(R.id.w_header, showHeader ? View.VISIBLE : View.GONE);
                  int avail = hDp - 20 - (showHeader ? 28 : 0);
                  int fit = Math.max(1, avail / 38);
                  if (fit > ROW.length) fit = ROW.length;

                  boolean overflow = n > fit;
                  int shown = overflow ? Math.max(1, fit - 1) : n;

                  for (int i = 0; i < ROW.length; i++) {
                      if (i < shown) {
                          JSONObject t = items[i];
                          boolean d = t.optInt("d", 0) == 1;
                          String title = t.optString("t", "");
                          int color;
                          try { color = Color.parseColor(t.optString("c", "#38bdf8")); }
                          catch (Exception e) { color = 0xFF38BDF8; }
                          String glyph = d ? "\u2714" : "\u25CB";
                          SpannableString s = new SpannableString(glyph + "  " + title);
                          s.setSpan(new ForegroundColorSpan(d ? 0xFF4ADE80 : color), 0, 1, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);
                          if (d && title.length() > 0) {
                              s.setSpan(new StrikethroughSpan(), 3, s.length(), Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);
                          }
                          v.setTextViewText(TXT[i], s);
                          v.setTextColor(TXT[i], d ? 0xFF64748B : 0xFFE2E8F0);
                          v.setInt(BAR[i], "setBackgroundColor", d ? ((color & 0x00FFFFFF) | 0x55000000) : color);
                          v.setInt(ROW[i], "setBackgroundResource", d ? R.drawable.widget_row_done_bg : R.drawable.widget_row_bg);
                          v.setViewVisibility(ROW[i], View.VISIBLE);
                      } else if (overflow && i == shown) {
                          v.setTextViewText(TXT[i], "+" + (n - shown) + " more");
                          v.setTextColor(TXT[i], 0xFF64748B);
                          v.setInt(BAR[i], "setBackgroundColor", 0x00000000);
                          v.setInt(ROW[i], "setBackgroundResource", R.drawable.widget_row_done_bg);
                          v.setViewVisibility(ROW[i], View.VISIBLE);
                      } else {
                          v.setViewVisibility(ROW[i], View.GONE);
                      }
                  }

                  v.setTextViewText(R.id.w_empty, emptyText());
                  v.setViewVisibility(R.id.w_empty, n == 0 ? View.VISIBLE : View.GONE);

                  v.setOnClickPendingIntent(R.id.w_root, openApp(ctx));
                  mgr.updateAppWidget(id, v);
              }

              static PendingIntent openApp(Context ctx) {
                  Intent i = ctx.getPackageManager().getLaunchIntentForPackage(ctx.getPackageName());
                  if (i == null) i = new Intent();
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  int flags = PendingIntent.FLAG_UPDATE_CURRENT;
                  if (Build.VERSION.SDK_INT >= 23) flags |= PendingIntent.FLAG_IMMUTABLE;
                  return PendingIntent.getActivity(ctx, 7002, i, flags);
              }
          }
          WEOF

          cat > android/app/src/main/java/com/hunter/arisesolo/widget/WidgetData.java << 'WEOF'
          package com.hunter.arisesolo.widget;

          import android.content.Context;
          import android.content.SharedPreferences;
          import android.widget.RemoteViews;
          import com.hunter.arisesolo.R;
          import org.json.JSONArray;
          import org.json.JSONObject;

          // Reads the data the web app pushes (group "AriseWidgets", key "tasks").
          final class WidgetData {
              private WidgetData() {}

              static JSONObject load(Context ctx) {
                  try {
                      SharedPreferences p = ctx.getSharedPreferences("AriseWidgets", Context.MODE_PRIVATE);
                      String raw = p.getString("tasks", null);
                      if (raw != null) return new JSONObject(raw);
                  } catch (Exception ignored) {}
                  return new JSONObject();
              }

              // If a widget fails to build, show the reason on the widget itself instead of "Can't load widget".
              static RemoteViews errorViews(Context ctx, Throwable t) {
                  RemoteViews v = new RemoteViews(ctx.getPackageName(), R.layout.widget_error);
                  String msg = String.valueOf(t);
                  if (msg.length() > 220) msg = msg.substring(0, 220);
                  v.setTextViewText(R.id.e_text, "Widget error:\n" + msg);
                  return v;
              }

              static JSONArray list(Context ctx, String kind) {
                  JSONArray a = load(ctx).optJSONArray(kind);
                  return a == null ? new JSONArray() : a;
              }
          }
          WEOF

      - name: Register task widgets in AndroidManifest
        run: |
          python3 << 'PYEOF'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          def recv(cls, label, res):
              return ('    <receiver android:name="com.hunter.arisesolo.widget.%s" android:exported="true" android:label="%s">'
                      '<intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/></intent-filter>'
                      '<meta-data android:name="android.appwidget.provider" android:resource="@xml/%s"/></receiver>\n') % (cls, label, res)
          block = (recv("DailiesWidget", "Arise Dailies", "widget_dailies_info")
                 + recv("QuestsWidget", "Arise Quests", "widget_quests_info")
                 + recv("StreakWidget", "Arise Streak", "widget_streak_info"))
          assert "</application>" in s
          s = s.replace("</application>", block + "</application>", 1)
          open(p, "w", encoding="utf-8").write(s)
          print("task widgets registered")
          PYEOF

      - name: Inject Exact Alarm Permissions
        run: |
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />' android/app/src/main/AndroidManifest.xml

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/my-release-key.jks

      - name: Build APK
        working-directory: ./android
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/my-release-key.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEY_STORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=my-key-alias \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Arisesolo-APK
          path: android/app/build/outputs/apk/release/app-release.apk