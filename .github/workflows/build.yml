          package com.hunter.arisesolo.widget;

          import android.content.Context;
          import android.content.SharedPreferences;
          import android.widget.RemoteViews;
          import com.hunter.arisesolo.R;
          import org.json.JSONArray;
          import org.json.JSONObject;

          // Reads the data the web app pushes (group "AriseWidgets", key "tasks").
          final class WidgetData {
              private WidgetData() {}

              static JSONObject load(Context ctx) {
                  try {
                      SharedPreferences p = ctx.getSharedPreferences("AriseWidgets", Context.MODE_PRIVATE);
                      String raw = p.getString("tasks", null);
                      if (raw != null) return new JSONObject(raw);
                  } catch (Exception ignored) {}
                  return new JSONObject();
              }

              // If a widget fails to build, show the reason on the widget itself instead of "Can't load widget".
              static RemoteViews errorViews(Context ctx, Throwable t) {
                  RemoteViews v = new RemoteViews(ctx.getPackageName(), R.layout.widget_error);
                  String msg = String.valueOf(t);
                  if (msg.length() > 220) msg = msg.substring(0, 220);
                  v.setTextViewText(R.id.e_text, "Widget error:\n" + msg);
                  return v;
              }

              static JSONArray list(Context ctx, String kind) {
                  JSONArray a = load(ctx).optJSONArray(kind);
                  return a == null ? new JSONArray() : a;
              }
          }
