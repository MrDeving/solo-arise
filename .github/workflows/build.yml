                          rv.setTextViewText(R.id.row_note, note);
                          rv.setTextColor(R.id.row_note, done ? 0x66B9C8DA : (WidgetData.frost(ctx, kind) ? 0xB3FFFFFF : 0xFF8B9BB0));
                      } catch (Throwable ignored) {}
                      try { rv.setViewVisibility(R.id.row_urgent, urgent ? android.view.View.VISIBLE : android.view.View.GONE); } catch (Throwable ignored) {}
                      try {
                          rv.setViewVisibility(R.id.row_cl, clTotal > 0 ? android.view.View.VISIBLE : android.view.View.GONE);
