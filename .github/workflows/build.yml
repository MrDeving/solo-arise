          import android.widget.RemoteViews;
          import com.hunter.arisesolo.R;
          import org.json.JSONArray;
          import org.json.JSONObject;

          // Reads the data the web app pushes (group "AriseWidgets", key "tasks").
          final class WidgetData {
              private WidgetData() {}

              // true when this widget kind uses the Frost theme (chosen in the app's Theme Studio; default is Obsidian)
              static boolean frost(Context ctx, String kind) {
                  try {
                      JSONObject t = load(ctx).optJSONObject("th");
                      return t != null && "frost".equals(t.optString(kind, "obsidian"));
                  } catch (Throwable e) { return false; }
              }

              static boolean anim(Context ctx) {
                  try {
                      JSONObject t = load(ctx).optJSONObject("th");
                      return t == null || t.optBoolean("anim", true);
                  } catch (Throwable e) { return true; }
              }

              static JSONObject load(Context ctx) {
                  try {
                      SharedPreferences p = ctx.getSharedPreferences("AriseWidgets", Context.MODE_PRIVATE);
                      String raw = p.getString("tasks", null);
                      if (raw != null) { JSONObject o = new JSONObject(raw); roll(ctx, o); return o; }
                  } catch (Exception ignored) {}
                  return new JSONObject();
              }

              // If a widget fails to build, show the reason on the widget itself instead of "Can't load widget".
              static RemoteViews errorViews(Context ctx, Throwable t) {
                  RemoteViews v = new RemoteViews(ctx.getPackageName(), R.layout.widget_error);
                  String msg = String.valueOf(t);
                  if (msg.length() > 220) msg = msg.substring(0, 220);
                  v.setTextViewText(R.id.e_text, "Widget error:\n" + msg);
                  return v;
              }

              // The app's "day" starts at the user's reset time, not always midnight.
              // Returns yyyy-MM-dd of the current app day (same rule the web app uses).
              static String logicalDay(int resetMin) {
                  java.util.Calendar c = java.util.Calendar.getInstance();
                  c.add(java.util.Calendar.MINUTE, -resetMin);
                  return String.format(java.util.Locale.US, "%04d-%02d-%02d",
                      c.get(java.util.Calendar.YEAR), c.get(java.util.Calendar.MONTH) + 1, c.get(java.util.Calendar.DAY_OF_MONTH));
              }

              // ---- widget taps: write the changed list back, queue the change for the app, remember open checklists ----
              static void save(Context ctx, JSONObject d) {
                  try { ctx.getSharedPreferences("AriseWidgets", Context.MODE_PRIVATE).edit().putString("tasks", d.toString()).apply(); } catch (Exception ignored) {}
              }

              static void queue(Context ctx, JSONObject act) {
                  try {
                      SharedPreferences p = ctx.getSharedPreferences("CapacitorStorage", Context.MODE_PRIVATE);
                      JSONArray a = new JSONArray(p.getString("widget_actions", "[]"));
                      a.put(act);
                      p.edit().putString("widget_actions", a.toString()).apply();
                  } catch (Exception ignored) {}
              }

              static void setOpenTab(Context ctx, String tab) {
                  try { ctx.getSharedPreferences("CapacitorStorage", Context.MODE_PRIVATE).edit().putString("widget_open_tab", tab).apply(); } catch (Exception ignored) {}
              }

              static boolean isExpanded(Context ctx, String key) {
                  try { return ctx.getSharedPreferences("AriseWidgets", Context.MODE_PRIVATE).getStringSet("exp", new java.util.HashSet<String>()).contains(key); }
                  catch (Throwable t) { return false; }
              }

              static void toggleExpanded(Context ctx, String key) {
                  try {
                      SharedPreferences p = ctx.getSharedPreferences("AriseWidgets", Context.MODE_PRIVATE);
                      java.util.Set<String> s = new java.util.HashSet<String>(p.getStringSet("exp", new java.util.HashSet<String>()));
                      if (!s.remove(key)) s.add(key);
                      p.edit().putStringSet("exp", s).apply();
                  } catch (Throwable ignored) {}
              }

              // New app day while the app is closed: un-check every daily and its checklist, and remember the new day
              private static void roll(Context ctx, JSONObject o) {
                  try {
                      String day = o.optString("day", "");
                      if (day.length() == 0) return;
                      String now = logicalDay(o.optInt("resetMin", 0));
                      if (day.equals(now)) return;
                      JSONArray a = o.optJSONArray("dailies");
                      if (a != null) for (int i = 0; i < a.length(); i++) {
                          JSONObject it = a.optJSONObject(i);
                          if (it == null) continue;
                          it.put("d", 0);
                          JSONArray cl = it.optJSONArray("cl");
                          if (cl != null) for (int j = 0; j < cl.length(); j++) { JSONArray pr = cl.optJSONArray(j); if (pr != null && pr.length() > 1) pr.put(1, 0); }
                      }
                      o.put("day", now);
                      ctx.getSharedPreferences("AriseWidgets", Context.MODE_PRIVATE).edit().putString("tasks", o.toString()).apply();
                  } catch (Throwable ignored) {}
              }

              // days between the day the app last synced and today (real calendar days, same as the app's schedule check)
              private static int dayOffset(String base) {
                  try {
                      String[] p = base.split("-");
                      java.util.Calendar b = java.util.Calendar.getInstance();
                      b.set(Integer.parseInt(p[0]), Integer.parseInt(p[1]) - 1, Integer.parseInt(p[2]), 12, 0, 0);
                      java.util.Calendar n = java.util.Calendar.getInstance();
                      n.set(java.util.Calendar.HOUR_OF_DAY, 12); n.set(java.util.Calendar.MINUTE, 0); n.set(java.util.Calendar.SECOND, 0);
                      long diff = Math.round((n.getTimeInMillis() - b.getTimeInMillis()) / 86400000.0);
                      return diff < 0 ? 0 : (int) diff;
                  } catch (Throwable e) { return -1; }
              }

              static JSONArray list(Context ctx, String kind) {
                  JSONObject o = load(ctx);
                  JSONArray a = o.optJSONArray(kind);
                  if (a == null) return new JSONArray();
                  if (!"dailies".equals(kind)) return a;
                  int off = dayOffset(o.optString("base", ""));
                  if (off < 0) return a;
                  JSONArray r = new JSONArray();
                  for (int i = 0; i < a.length(); i++) {
                      JSONObject it = a.optJSONObject(i);
                      if (it == null) continue;
                      String m = it.optString("a", "");
                      if (m.length() > off && m.charAt(off) == '0') continue;   // not due today
                      r.put(it);
                  }
                  return r;
              }
          }
