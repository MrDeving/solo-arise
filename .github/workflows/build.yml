          cat > android/app/src/main/java/com/hunter/arisesolo/widget/DualTasksWidget.java << 'WEOF'
          package com.hunter.arisesolo.widget;

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.widget.RemoteViews;
          import com.hunter.arisesolo.R;
          import org.json.JSONArray;
          import org.json.JSONObject;

          // ONE widget with a Dailies tab and a Quests tab. Same rows, taps and resizing as the two separate widgets.
          // Its own themes are stored under "dd" (Dailies tab) and "dq" (Quests tab).
          public class DualTasksWidget extends AppWidgetProvider {
              static final String ACTION_TAB = "com.hunter.arisesolo.widget.DUAL_TAB";
              static void refresh(Context ctx, int id) { new DualTasksWidget().safeRender(ctx, AppWidgetManager.getInstance(ctx), id); }

              private static SharedPreferences prefs(Context ctx) {
                  return ctx.getSharedPreferences("AriseWidgets", Context.MODE_PRIVATE);
              }

              static String tabOf(Context ctx, int id) {
                  try { return "quests".equals(prefs(ctx).getString("dualtab_" + id, "dailies")) ? "quests" : "dailies"; }
                  catch (Throwable t) { return "dailies"; }
              }

              @Override
              public void onUpdate(Context ctx, AppWidgetManager mgr, int[] ids) {
                  for (int id : ids) safeRender(ctx, mgr, id);
              }

              @Override
              public void onAppWidgetOptionsChanged(Context ctx, AppWidgetManager mgr, int id, Bundle newOptions) {
                  safeRender(ctx, mgr, id);
              }

              @Override
              public void onDeleted(Context ctx, int[] ids) {
                  try {
                      SharedPreferences.Editor e = prefs(ctx).edit();
                      for (int id : ids) e.remove("dualtab_" + id);
                      e.apply();
                  } catch (Throwable ignored) {}
              }

              @Override
              public void onReceive(Context ctx, Intent intent) {
                  super.onReceive(ctx, intent);
                  if (intent != null && ACTION_TAB.equals(intent.getAction())) {
                      int id = intent.getIntExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, -1);
                      String tab = intent.getStringExtra("tab");
                      if (id != -1 && tab != null) {
                          try { prefs(ctx).edit().putString("dualtab_" + id, tab).apply(); } catch (Throwable ignored) {}
                          safeRender(ctx, AppWidgetManager.getInstance(ctx), id);
                      }
                  }
              }

              private void safeRender(Context ctx, AppWidgetManager mgr, int id) {
                  try {
                      render(ctx, mgr, id);
                  } catch (Throwable t) {
                      try { mgr.updateAppWidget(id, WidgetData.errorViews(ctx, t)); } catch (Throwable ignored) {}
                  }
              }

              private static PendingIntent tabIntent(Context ctx, int id, String tab) {
                  // goes through the invisible WidgetActionActivity: one tap switches the tab, a quick second tap on the same tab opens the app there
                  Intent i = new Intent(ctx, WidgetActionActivity.class);
                  i.putExtra("act", "dualtab");
                  i.putExtra("kind", tab);
                  i.putExtra("wid", id);
                  i.setData(Uri.parse("arise://dualtab/" + id + "/" + tab));
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  int flags = PendingIntent.FLAG_UPDATE_CURRENT;
                  if (Build.VERSION.SDK_INT >= 23) flags |= PendingIntent.FLAG_IMMUTABLE;
                  return PendingIntent.getActivity(ctx, id * 10 + ("quests".equals(tab) ? 2 : 1), i, flags);
              }

              private void render(Context ctx, AppWidgetManager mgr, int id) {
                  String kind = tabOf(ctx, id);
                  boolean dl = "dailies".equals(kind);
                  String tk = dl ? "dd" : "dq";
                  RemoteViews v = new RemoteViews(ctx.getPackageName(), R.layout.widget_tasks_dual);

                  JSONArray items = WidgetData.list(ctx, kind);
                  int total = 0, done = 0;
                  for (int i = 0; i < items.length(); i++) {
                      JSONObject o = items.optJSONObject(i);
                      if (o == null) continue;
                      total++;
                      if (o.optInt("d", 0) == 1) done++;
                  }
                  String count = "";
                  int countColor = 0xFF9FB3C8;
                  if (total > 0) {
                      if (dl) {
                          if (done == total) { count = "ALL DONE"; countColor = 0xFF34D399; }
                          else count = done + "/" + total;
                      } else {
                          count = String.valueOf(total);
                      }
                  }

                  boolean fr = WidgetData.frost(ctx, tk);
                  v.setInt(R.id.w_root, "setBackgroundResource", fr ? R.drawable.widget_card_frost : R.drawable.widget_card_obs);
                  v.setInt(R.id.w_count, "setBackgroundResource", fr ? R.drawable.widget_pill_frost : R.drawable.widget_pill_obs);
                  int dim = fr ? 0xB3FFFFFF : 0xFF8B9BB0;
                  v.setTextColor(R.id.w_tab_d, dl ? 0xFF38BDF8 : dim);
                  v.setTextColor(R.id.w_tab_q, dl ? dim : 0xFFFBBF24);
                  v.setInt(R.id.w_tab_d, "setBackgroundResource", dl ? R.drawable.widget_tab_on : R.drawable.widget_tab_off);
                  v.setInt(R.id.w_tab_q, "setBackgroundResource", dl ? R.drawable.widget_tab_off : R.drawable.widget_tab_on);
                  v.setOnClickPendingIntent(R.id.w_tab_d, tabIntent(ctx, id, "dailies"));
                  v.setOnClickPendingIntent(R.id.w_tab_q, tabIntent(ctx, id, "quests"));
                  v.setTextViewText(R.id.w_empty, dl ? "NOTHING DUE TODAY" : "NO ACTIVE QUESTS");
                  v.setTextColor(R.id.w_count, countColor);

                  PendingIntent open = TasksWidgetBase.actionIntent(ctx, "open", kind, false);
                  v.setOnClickPendingIntent(R.id.w_count, open);
                  v.setOnClickPendingIntent(R.id.w_empty, open);

                  // the header always stays (it holds the tabs); only the progress bar hides when the widget is very short
                  Bundle o = mgr.getAppWidgetOptions(id);
                  int h = (o == null) ? 0 : o.getInt(AppWidgetManager.OPTION_APPWIDGET_MIN_HEIGHT, 0);
                  boolean bar = dl && total > 0 && !(h > 0 && h < 90);
                  v.setViewVisibility(R.id.w_bar, bar ? View.VISIBLE : View.GONE);
                  if (bar) v.setProgressBar(R.id.w_bar, 100, Math.round(done * 100f / total), false);

                  // same scrollable rows as the single widgets; "tk" tells the rows which theme to use
                  Intent svc = new Intent(ctx, DualRowsService.class);
                  svc.putExtra("kind", kind);
                  svc.putExtra("tk", tk);
                  svc.putExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, id);
                  svc.setData(Uri.parse("arise://dual/" + kind + "/" + id));
                  v.setRemoteAdapter(R.id.w_list, svc);
                  v.setEmptyView(R.id.w_list, R.id.w_empty);
                  v.setPendingIntentTemplate(R.id.w_list, TasksWidgetBase.actionIntent(ctx, "open", kind, true));

                  v.setTextViewText(R.id.w_count, count);
                  v.setViewVisibility(R.id.w_count, count.length() == 0 ? View.GONE : View.VISIBLE);

                  mgr.updateAppWidget(id, v);
                  mgr.notifyAppWidgetViewDataChanged(id, R.id.w_list);
              }
          }
          WEOF

          cat > android/app/src/main/java/com/hunter/arisesolo/widget/DualRowsService.java << 'WEOF'
          package com.hunter.arisesolo.widget;

          import android.content.Intent;
          import android.widget.RemoteViewsService;

          // Feeds the list of the dual widget: the same rows as the single widgets, themed by the tab ("dd" or "dq").
          public class DualRowsService extends RemoteViewsService {
