      - name: Register task widgets in AndroidManifest
        run: |
          python3 << 'PYEOF'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          def recv(cls, label, res):
              return ('    <receiver android:name="com.hunter.arisesolo.widget.%s" android:exported="true" android:label="%s">'
                      '<intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/></intent-filter>'
                      '<meta-data android:name="android.appwidget.provider" android:resource="@xml/%s"/></receiver>\n') % (cls, label, res)
          block = (recv("DailiesWidget", "Arise Dailies", "widget_dailies_info")
                 + recv("QuestsWidget", "Arise Quests", "widget_quests_info")
                 + recv("StreakWidget", "Arise Streak", "widget_streak_info")
                 + '    <service android:name="com.hunter.arisesolo.widget.TasksWidgetService" android:permission="android.permission.BIND_REMOTEVIEWS" android:exported="false"/>\n')
          assert "</application>" in s
          s = s.replace("</application>", block + "</application>", 1)
          open(p, "w", encoding="utf-8").write(s)
          print("task widgets registered")
          PYEOF

      - name: Inject Exact Alarm Permissions
        run: |
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />' android/app/src/main/AndroidManifest.xml

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/my-release-key.jks

      - name: Build APK
        working-directory: ./android
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/my-release-key.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEY_STORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=my-key-alias \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Arisesolo-APK
          path: android/app/build/outputs/apk/release/app-release.apk