          import com.hunter.arisesolo.R;
          import org.json.JSONArray;
          import org.json.JSONObject;

          // Feeds the scrolling lists of the Dailies and Quests widgets (rows, checklists, urgent glow).
          public class TaskRowsService extends RemoteViewsService {
              @Override
              public RemoteViewsFactory onGetViewFactory(Intent intent) {
                  return new Factory(getApplicationContext(), intent.getStringExtra("kind"));
              }

              static class Factory implements RemoteViewsService.RemoteViewsFactory {
                  private static final int[] CL  = { R.id.cl0, R.id.cl1, R.id.cl2, R.id.cl3, R.id.cl4, R.id.cl5, R.id.cl6, R.id.cl7, R.id.cl8, R.id.cl9 };
                  private static final int[] CLC = { R.id.cl0c, R.id.cl1c, R.id.cl2c, R.id.cl3c, R.id.cl4c, R.id.cl5c, R.id.cl6c, R.id.cl7c, R.id.cl8c, R.id.cl9c };
                  private static final int[] CLT = { R.id.cl0t, R.id.cl1t, R.id.cl2t, R.id.cl3t, R.id.cl4t, R.id.cl5t, R.id.cl6t, R.id.cl7t, R.id.cl8t, R.id.cl9t };
                                    // theme key: the single widgets use their own kind; the dual widget passes "dd" / "dq"
                  private String tkey = null;
                  Factory(Context c, String k, String t) { this(c, k); tkey = t; }
                  private String tk() { return tkey == null ? kind : tkey; }

                  private final Context ctx;
                  private final String kind;
                  private JSONArray items = new JSONArray();

                  Factory(Context c, String k) {
                      ctx = c;
                      kind = (k == null) ? "dailies" : k;
                  }

                  @Override public void onCreate() { onDataSetChanged(); }
                  @Override public void onDestroy() {}

                  @Override
                  public void onDataSetChanged() {
                      // urgent first, then the other pending tasks, finished ones (struck through) last
                      JSONArray src = WidgetData.list(ctx, kind);
                      JSONArray out = new JSONArray();
                      for (int pass = 0; pass < 3; pass++) {
                          for (int i = 0; i < src.length(); i++) {
                              JSONObject o = src.optJSONObject(i);
                              if (o == null) continue;
                              boolean done = o.optInt("d", 0) == 1;
                              boolean urg = o.optInt("u", 0) == 1 && !done;
                              if ((pass == 0 && urg) || (pass == 1 && !urg && !done) || (pass == 2 && done)) out.put(o);
                          }
                      }
                      items = out;
                  }

                  @Override public int getCount() { return items.length(); }

                  // what a tap sends to WidgetActionActivity (merged into the list's template intent)
                  private Intent fill(String act, String tid, int j) {
                      Intent f = new Intent();
                      f.putExtra("act", act);
                      f.putExtra("kind", kind);
                      f.putExtra("tid", tid);
                      f.putExtra("j", j);
                      return f;
                  }

                  @Override
                  public RemoteViews getViewAt(int pos) {
                      RemoteViews rv = new RemoteViews(ctx.getPackageName(), R.layout.widget_task_row);
                      JSONObject o = items.optJSONObject(pos);
                      if (o == null) return rv;
                      boolean done = o.optInt("d", 0) == 1;
                      String tid = o.optString("i", "");
                      String title = o.optString("t", "");
                      String note = o.optString("n", "").trim();
                      boolean urgent = o.optInt("u", 0) == 1 && !done;
                      int streak = o.optInt("s", 0);
                      int color;
                      try { color = Color.parseColor(o.optString("c", "#38bdf8")); }
                      catch (Exception e) { color = 0xFF38BDF8; }
                      JSONArray cl = o.optJSONArray("cl");
                      int clTotal = (cl == null) ? 0 : cl.length();
                      int clDone = 0;
                      for (int j = 0; j < clTotal; j++) {
                          JSONArray c = cl.optJSONArray(j);
                          if (c != null && c.optInt(1, 0) == 1) clDone++;
                      }
                      boolean open = clTotal > 0 && WidgetData.isExpanded(ctx, kind + ":" + tid);

                      // essentials first: the text always shows, nothing below can stop it
                      rv.setTextViewText(R.id.row_title, title);
                      rv.setTextViewText(R.id.row_check, done ? "✓" : "");

                      // taps: check button = tick, 1/3 chip = drop the checklist, rest of the row = open the app
                      try { rv.setOnClickFillInIntent(R.id.row_slab, fill("task", tid, -1)); } catch (Throwable ignored) {}
                      try { rv.setOnClickFillInIntent(R.id.row_main, fill("open", tid, -1)); } catch (Throwable ignored) {}

                      // decorations: each one isolated so a single failure can't kill the row
                      try {
                          if (done && title.length() > 0) {
                              SpannableString s = new SpannableString(title);
                              s.setSpan(new StrikethroughSpan(), 0, title.length(), Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);
                              rv.setTextViewText(R.id.row_title, s);
                          }
                      } catch (Throwable ignored) {}
                      try { rv.setTextColor(R.id.row_title, done ? 0x73FFFFFF : (urgent ? 0xFFFFE4E4 : 0xFFFFFFFF)); } catch (Throwable ignored) {}
                      try {
                          rv.setViewVisibility(R.id.row_note, note.length() > 0 ? View.VISIBLE : View.GONE);
                          rv.setTextViewText(R.id.row_note, note);
                          rv.setTextColor(R.id.row_note, done ? 0x66B9C8DA : (WidgetData.frost(ctx, tk()) ? 0xB3FFFFFF : 0xFF8B9BB0));
                      } catch (Throwable ignored) {}
                      try { rv.setViewVisibility(R.id.row_urgent, urgent ? View.VISIBLE : View.GONE); } catch (Throwable ignored) {}
                      try {
                          rv.setViewVisibility(R.id.row_cl, clTotal > 0 ? View.VISIBLE : View.GONE);
                          rv.setTextViewText(R.id.row_cl, clDone + "/" + clTotal);
                          rv.setInt(R.id.row_cl, "setBackgroundResource", open ? R.drawable.widget_chip2_open : R.drawable.widget_chip2);
                          rv.setOnClickFillInIntent(R.id.row_cl, fill("exp", tid, -1));
                      } catch (Throwable ignored) {}
                      try {
                          rv.setViewVisibility(R.id.row_streak, streak > 0 ? View.VISIBLE : View.GONE);
                          rv.setTextViewText(R.id.row_streak_n, String.valueOf(streak));
                      } catch (Throwable ignored) {}
                      boolean fr = WidgetData.frost(ctx, tk());
                      try { rv.setInt(R.id.row_bar, "setColorFilter", color | 0xFF000000); rv.setInt(R.id.row_bar, "setImageAlpha", done ? 90 : 255); } catch (Throwable ignored) {}
                      try {
                          rv.setImageViewResource(R.id.row_ring, (done || !fr) ? R.drawable.widget_disc : R.drawable.widget_ring_tint);
                          rv.setViewVisibility(R.id.row_hole, (!done && !fr) ? View.VISIBLE : View.INVISIBLE);
                          boolean pulse = urgent && WidgetData.anim(ctx);
                          rv.setViewVisibility(R.id.row_pulse, pulse ? View.VISIBLE : View.GONE);
                          if (pulse) rv.setImageViewResource(R.id.row_pulse_a, fr ? R.drawable.widget_pulse_frost : R.drawable.widget_pulse_obs);
                          rv.setInt(R.id.row_ring, "setColorFilter", color | 0xFF000000);
                          rv.setInt(R.id.row_ring, "setImageAlpha", done ? 170 : 255);
                      } catch (Throwable ignored) {}
                      boolean ua = urgent && WidgetData.anim(ctx);
                      try { rv.setInt(R.id.row_card, "setBackgroundResource", fr ? (done ? R.drawable.widget_row_frost_done : (urgent ? (ua ? R.drawable.widget_row_frost_urgentdim : R.drawable.widget_row_frost_urgent) : R.drawable.widget_row_frost_bg)) : (done ? R.drawable.widget_row_obs_done : (urgent ? (ua ? R.drawable.widget_row_obs_urgentdim : R.drawable.widget_row_obs_urgent) : R.drawable.widget_row_obs_bg))); } catch (Throwable ignored) {}

                      // checklist dropdown (first 10 items)
                      try {
                          rv.setViewVisibility(R.id.row_cl_list, open ? View.VISIBLE : View.GONE);
                          for (int j = 0; j < CL.length; j++) {
                              JSONArray c = (open && j < clTotal) ? cl.optJSONArray(j) : null;
                              if (c == null) { rv.setViewVisibility(CL[j], View.GONE); continue; }
                              boolean cd = c.optInt(1, 0) == 1;
                              String ct = c.optString(0, "");
                              rv.setViewVisibility(CL[j], View.VISIBLE);
                              rv.setTextViewText(CLC[j], cd ? "✓" : "");
                              rv.setInt(CLC[j], "setBackgroundResource", cd ? R.drawable.widget_clc_on : R.drawable.widget_clc);
                              SpannableString cs = new SpannableString(ct);
                              if (cd && ct.length() > 0) cs.setSpan(new StrikethroughSpan(), 0, ct.length(), Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);
                              rv.setTextViewText(CLT[j], cs);
                              rv.setTextColor(CLT[j], cd ? 0x80FFFFFF : 0xFFFFFFFF);
                              rv.setOnClickFillInIntent(CL[j], fill("cl", tid, j));
                          }
                      } catch (Throwable ignored) {}
                      return rv;
                  }

                  @Override public RemoteViews getLoadingView() { return null; }
                  @Override public int getViewTypeCount() { return 1; }
                  @Override public long getItemId(int position) {
                      JSONObject o = items.optJSONObject(position);
                      return o == null ? position : (kind + ":" + o.optString("i", "")).hashCode();
                  }
                  @Override public boolean hasStableIds() { return true; }
              }
          }
