          cat > android/app/src/main/java/com/hunter/arisesolo/widget/StreakWidget.java << 'WEOF'
          package com.hunter.arisesolo.widget;

          import android.appwidget.AppWidgetManager;
          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Bundle;
          import android.widget.RemoteViews;
          import com.hunter.arisesolo.R;
          import org.json.JSONObject;

          // Streak widget: switches between a compact and a full layout depending on its size.
          public class StreakWidget extends AppWidgetProvider {
              // 1.0 = full height the launcher gives; lower = shorter card. Tweak this one number.
              private static final float STREAK_HEIGHT_FACTOR = 0.80f;
              private static final String ACTION_DAY_ROLLOVER = "com.hunter.arisesolo.widget.DAY_ROLLOVER";

              // Fires at the app's daily reset time so the widget flips to "not secured" without opening the app.
              @Override
              public void onReceive(Context ctx, Intent intent) {
                  if (intent != null && ACTION_DAY_ROLLOVER.equals(intent.getAction())) {
                      AppWidgetManager mgr = AppWidgetManager.getInstance(ctx);
                      int[] ids = mgr.getAppWidgetIds(new ComponentName(ctx, StreakWidget.class));
                      for (int id : ids) safeRender(ctx, mgr, id);
                      return;
                  }
                  super.onReceive(ctx, intent);
              }

              private static void scheduleRollover(Context ctx, int resetMin) {
                  try {
                      java.util.Calendar c = java.util.Calendar.getInstance();
                      c.set(java.util.Calendar.HOUR_OF_DAY, resetMin / 60);
                      c.set(java.util.Calendar.MINUTE, resetMin % 60);
                      c.set(java.util.Calendar.SECOND, 5);
                      c.set(java.util.Calendar.MILLISECOND, 0);
                      if (c.getTimeInMillis() <= System.currentTimeMillis()) c.add(java.util.Calendar.DAY_OF_YEAR, 1);
                      Intent i = new Intent(ctx, StreakWidget.class).setAction(ACTION_DAY_ROLLOVER);
                      PendingIntent pi = PendingIntent.getBroadcast(ctx, 7301, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                      AlarmManager am = (AlarmManager) ctx.getSystemService(Context.ALARM_SERVICE);
                      if (am != null) am.set(AlarmManager.RTC_WAKEUP, c.getTimeInMillis(), pi);
                  } catch (Throwable ignored) {}
              }

              @Override
              public void onUpdate(Context ctx, AppWidgetManager mgr, int[] ids) {
                  for (int id : ids) safeRender(ctx, mgr, id);
              }

              @Override
              public void onAppWidgetOptionsChanged(Context ctx, AppWidgetManager mgr, int id, Bundle newOptions) {
                  safeRender(ctx, mgr, id);
              }

              private static void safeRender(Context ctx, AppWidgetManager mgr, int id) {
                  try {
                      render(ctx, mgr, id);
                  } catch (Throwable t) {
                      try { mgr.updateAppWidget(id, WidgetData.errorViews(ctx, t)); } catch (Throwable ignored) {}
                  }
              }

              private static void render(Context ctx, AppWidgetManager mgr, int id) {
                  JSONObject d = WidgetData.load(ctx);
                  int streak = d.optInt("streak", 0);
                  boolean claimed = d.optBoolean("claimed", false);
                  int resetMin = d.optInt("resetMin", 0);
                  String claimedDay = d.optString("claimedDay", "");
                  // Secured only counts for the app day it was earned on; a new day means "do a daily" again.
                  if (claimed && claimedDay.length() > 0 && !claimedDay.equals(WidgetData.logicalDay(resetMin))) claimed = false;
                  scheduleRollover(ctx, resetMin);

                  Bundle o = mgr.getAppWidgetOptions(id);
                  boolean portrait = ctx.getResources().getConfiguration().orientation != android.content.res.Configuration.ORIENTATION_LANDSCAPE;
                  int w = 0, h = 0;
                  if (o != null) {
                      w = o.getInt(portrait ? AppWidgetManager.OPTION_APPWIDGET_MIN_WIDTH : AppWidgetManager.OPTION_APPWIDGET_MAX_WIDTH, 0);
                      h = o.getInt(portrait ? AppWidgetManager.OPTION_APPWIDGET_MAX_HEIGHT : AppWidgetManager.OPTION_APPWIDGET_MIN_HEIGHT, 0);
                  }
                  boolean small = (w > 0 && w < 120) || (h > 0 && h < 100);

                  RemoteViews v = new RemoteViews(ctx.getPackageName(), small ? R.layout.widget_streak_small : R.layout.widget_streak);
                  int color = claimed ? 0xFFFBBF24 : 0xFF7B8AA3;
                  v.setTextViewText(R.id.s_number, String.valueOf(streak));
                  try { v.setInt(R.id.s_flame, "setColorFilter", color); } catch (Throwable ignored) {}
                  v.setTextColor(R.id.s_number, color);
                  if (!small) {
                      // Card height: STREAK_HEIGHT_FACTOR of the space the launcher gives us (it was too tall).
                      // The leftover space is split top/bottom and stays transparent.
                      try {
                          if (h > 0) {
                              float density = ctx.getResources().getDisplayMetrics().density;
                              float target = Math.max(h * STREAK_HEIGHT_FACTOR, 128f);
                              int pad = (int) (Math.max(0f, (h - target) / 2f) * density);
                              v.setViewPadding(R.id.s_outer, 0, pad, 0, pad);
                          }
                      } catch (Throwable ignored) {}

                      boolean tight = (w > 0 && w < 118);   // narrowest (2x2) sizes: shorter text so it never wraps
                      v.setTextViewText(R.id.s_label, streak == 1 ? "DAY STREAK" : "DAYS STREAK");
                      v.setTextColor(R.id.s_label, color);
                      v.setTextViewText(R.id.s_status, claimed ? (tight ? "SAFE" : "SAFE TODAY") : (tight ? "DO DAILY" : "DO A DAILY"));
                      v.setTextColor(R.id.s_status, claimed ? 0xFFA7F3D0 : 0xFF94A3B8);
                      v.setInt(R.id.s_status_row, "setBackgroundResource",
                          claimed ? R.drawable.widget_status_on_bg : R.drawable.widget_status_off_bg);
                      v.setImageViewResource(R.id.s_status_icon,
                          claimed ? R.drawable.ic_status_on : R.drawable.ic_status_off);
                  }
                  v.setOnClickPendingIntent(R.id.s_root, TasksWidgetBase.openApp(ctx, false));
                  mgr.updateAppWidget(id, v);
              }
          }
          WEOF

