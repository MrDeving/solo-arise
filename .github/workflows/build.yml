          WEOF

          cat > android/app/src/main/res/drawable/widget_row_bg.xml << 'WEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#B31E293B"/>
              <corners android:radius="12dp"/>
          </shape>
          WEOF

          cat > android/app/src/main/res/drawable/widget_row_done_bg.xml << 'WEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#621E293B"/>
              <corners android:radius="12dp"/>
          </shape>
          WEOF

          cat > android/app/src/main/res/layout/widget_tasks.xml << 'WEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/w_root"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:orientation="vertical" android:padding="12dp"
              android:background="@drawable/widget_card_bg">
              <LinearLayout android:id="@+id/w_top"
                  android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:orientation="vertical" android:paddingBottom="10dp">
                  <LinearLayout android:id="@+id/w_header"
                      android:layout_width="match_parent" android:layout_height="wrap_content"
                      android:orientation="horizontal" android:gravity="center_vertical"
                      android:paddingStart="2dp" android:paddingEnd="2dp">
                      <TextView android:id="@+id/w_title"
                          android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1"
                          android:textSize="14sp" android:textStyle="bold" android:letterSpacing="0.14"
                          android:maxLines="1" android:ellipsize="end"
                          android:fontFamily="@font/rajdhani" android:textColor="#38BDF8"/>
                      <TextView android:id="@+id/w_count"
                          android:layout_width="wrap_content" android:layout_height="wrap_content"
                          android:layout_marginStart="8dp"
                          android:background="@drawable/widget_pill_bg"
                          android:paddingStart="10dp" android:paddingEnd="10dp" android:paddingTop="4dp" android:paddingBottom="4dp"
                          android:maxLines="1" android:textSize="12sp" android:textStyle="bold" android:letterSpacing="0.08"
                          android:fontFamily="@font/rajdhani" android:textColor="#9FB3C8"/>
                  </LinearLayout>
                  <ProgressBar android:id="@+id/w_bar" style="?android:attr/progressBarStyleHorizontal"
                      android:layout_width="match_parent" android:layout_height="4dp"
                      android:layout_marginTop="8dp" android:layout_marginStart="2dp" android:layout_marginEnd="2dp"
                      android:minHeight="4dp" android:maxHeight="4dp" android:max="100" android:progress="0"
                      android:indeterminate="false" android:progressDrawable="@drawable/widget_bar_progress"/>
              </LinearLayout>
              <FrameLayout android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1">
                  <LinearLayout android:id="@+id/w_rows"
                      android:layout_width="match_parent" android:layout_height="match_parent"
                      android:orientation="vertical">
                      <LinearLayout android:id="@+id/r0"
                          android:layout_width="match_parent" android:layout_height="wrap_content"
                          android:orientation="horizontal" android:gravity="center_vertical"
                          android:layout_marginBottom="6dp" android:background="@drawable/widget_row_bg"
                          android:visibility="gone">
                          <FrameLayout android:layout_width="44dp" android:layout_height="match_parent">
                              <ImageView android:id="@+id/r0s"
                                  android:layout_width="match_parent" android:layout_height="match_parent"
                                  android:scaleType="fitXY" android:src="@drawable/widget_slab"/>
                              <TextView android:id="@+id/r0m"
                                  android:layout_width="24dp" android:layout_height="24dp"
                                  android:layout_gravity="center" android:gravity="center"
                                  android:background="@drawable/widget_check_box"
                                  android:textSize="14sp" android:textStyle="bold" android:textColor="#F2FFFFFF"/>
                          </FrameLayout>
                          <TextView android:id="@+id/r0t"
                              android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1"
                              android:minHeight="44dp" android:gravity="center_vertical"
                              android:paddingStart="12dp" android:paddingEnd="12dp" android:paddingTop="10dp" android:paddingBottom="10dp"
                              android:maxLines="2" android:ellipsize="end"
                              android:fontFamily="sans-serif-medium" android:textSize="14sp" android:textColor="#FFFFFF"/>
