          package com.hunter.arisesolo.widget;

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.widget.RemoteViews;
          import com.hunter.arisesolo.R;
          import org.json.JSONArray;
          import org.json.JSONObject;

          // Shared logic for the Dailies and Quests widgets (scrollable list, any size).
          public abstract class TasksWidgetBase extends AppWidgetProvider {
              abstract String kind();
              abstract String title();
              abstract int accent();
              abstract String emptyText();

              @Override
              public void onUpdate(Context ctx, AppWidgetManager mgr, int[] ids) {
                  for (int id : ids) safeRender(ctx, mgr, id);

              }

              // Called while the user drags the resize handles
              @Override
              public void onAppWidgetOptionsChanged(Context ctx, AppWidgetManager mgr, int id, Bundle newOptions) {
                  safeRender(ctx, mgr, id);

              }

              private void safeRender(Context ctx, AppWidgetManager mgr, int id) {
                  try {
                      render(ctx, mgr, id);
                  } catch (Throwable t) {
                      try { mgr.updateAppWidget(id, WidgetData.errorViews(ctx, t)); } catch (Throwable ignored) {}
                  }
              }

              private void render(Context ctx, AppWidgetManager mgr, int id) {
                  RemoteViews v = new RemoteViews(ctx.getPackageName(), R.layout.widget_tasks);

                  JSONArray items = WidgetData.list(ctx, kind());
                  int total = 0, done = 0;
                  for (int i = 0; i < items.length(); i++) {
                      JSONObject o = items.optJSONObject(i);
                      if (o == null) continue;
                      total++;
                      if (o.optInt("d", 0) == 1) done++;
                  }
                  String count = "";
                  int countColor = 0xFF9FB3C8;
                  if (total > 0) {
                      if ("dailies".equals(kind())) {
                          if (done == total) { count = "ALL DONE ✔"; countColor = 0xFF34D399; }
                          else count = done + "/" + total;
                      } else {
                          count = String.valueOf(total);
                      }
                  }
                  v.setTextViewText(R.id.w_title, title());
                  v.setTextColor(R.id.w_title, accent());
                  v.setTextViewText(R.id.w_empty, emptyText());
                  v.setTextColor(R.id.w_count, countColor);

                  PendingIntent open = openApp(ctx, false);
                  v.setOnClickPendingIntent(R.id.w_header, open);
                  v.setOnClickPendingIntent(R.id.w_empty, open);

                  Bundle o = mgr.getAppWidgetOptions(id);
                  int h = (o == null) ? 0 : o.getInt(AppWidgetManager.OPTION_APPWIDGET_MIN_HEIGHT, 0);
                  boolean hideHeader = (h > 0 && h < 90);
                  boolean bar = "dailies".equals(kind()) && total > 0 && !hideHeader;
                  v.setViewVisibility(R.id.w_top, hideHeader ? View.GONE : View.VISIBLE);
                  v.setViewVisibility(R.id.w_bar, bar ? View.VISIBLE : View.GONE);
                  if (bar) v.setProgressBar(R.id.w_bar, 100, Math.round(done * 100f / total), false);

                  // how many rows fit (each row is about 50dp including its gap)
                  int maxRows = 5;
                  if (h > 0) {
                      int avail = h - 24 - (hideHeader ? 0 : 38 + (bar ? 12 : 0));
                      maxRows = Math.max(1, avail / 50);
                  }

                  int[] rowIds  = { R.id.r0, R.id.r1, R.id.r2, R.id.r3, R.id.r4, R.id.r5, R.id.r6, R.id.r7 };
                  int[] slabIds = { R.id.r0s, R.id.r1s, R.id.r2s, R.id.r3s, R.id.r4s, R.id.r5s, R.id.r6s, R.id.r7s };
                  int[] markIds = { R.id.r0m, R.id.r1m, R.id.r2m, R.id.r3m, R.id.r4m, R.id.r5m, R.id.r6m, R.id.r7m };
                  int[] textIds = { R.id.r0t, R.id.r1t, R.id.r2t, R.id.r3t, R.id.r4t, R.id.r5t, R.id.r6t, R.id.r7t };
                  if (maxRows > rowIds.length) maxRows = rowIds.length;
                  int shown = 0;
                  for (int pass = 0; pass < 2 && shown < maxRows; pass++) {
                      for (int i = 0; i < items.length() && shown < maxRows; i++) {
                          JSONObject t = items.optJSONObject(i);
                          if (t == null) continue;
                          boolean isDone = t.optInt("d", 0) == 1;
                          if ((pass == 0 && isDone) || (pass == 1 && !isDone)) continue;
                          int col = 0xFF38BDF8;
                          try { col = android.graphics.Color.parseColor(t.optString("c", "#38bdf8")); } catch (Throwable ignored) {}
                          String title = t.optString("t", "");

                          // essentials first: the text always shows, nothing below can stop it
                          v.setTextViewText(textIds[shown], title);
                          v.setViewVisibility(rowIds[shown], View.VISIBLE);
                          v.setOnClickPendingIntent(rowIds[shown], open);

                          // decorations: each one isolated so a single failure can't kill the row
                          try {
                              if (isDone && title.length() > 0) {
                                  android.text.SpannableString s = new android.text.SpannableString(title);
                                  s.setSpan(new android.text.style.StrikethroughSpan(), 0, title.length(), android.text.Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);
                                  v.setTextViewText(textIds[shown], s);
                              }
                          } catch (Throwable ignored) {}
                          try { v.setTextColor(textIds[shown], isDone ? 0x8CFFFFFF : 0xFFFFFFFF); } catch (Throwable ignored) {}
                          try { v.setTextViewText(markIds[shown], isDone ? "✓" : ""); } catch (Throwable ignored) {}
                          try { v.setInt(markIds[shown], "setBackgroundResource", isDone ? R.drawable.widget_check_box_done : R.drawable.widget_check_box); } catch (Throwable ignored) {}
                          try { v.setInt(slabIds[shown], "setColorFilter", isDone ? ((col & 0x00FFFFFF) | 0x78000000) : ((col & 0x00FFFFFF) | 0xDB000000)); } catch (Throwable ignored) {}
                          try { v.setInt(rowIds[shown], "setBackgroundResource", isDone ? R.drawable.widget_row_done_bg : R.drawable.widget_row_bg); } catch (Throwable ignored) {}
                          shown++;
                      }
                  }
                  for (int j = shown; j < rowIds.length; j++) v.setViewVisibility(rowIds[j], View.GONE);
                  v.setViewVisibility(R.id.w_empty, total == 0 ? View.VISIBLE : View.GONE);
                  v.setViewVisibility(R.id.w_rows, total == 0 ? View.GONE : View.VISIBLE);

                  if (total > shown) count = count + "  +" + (total - shown);
                  v.setTextViewText(R.id.w_count, count);
                  v.setViewVisibility(R.id.w_count, count.length() == 0 ? View.GONE : View.VISIBLE);

                  mgr.updateAppWidget(id, v);
              }

              private static RemoteViews buildRow(Context ctx, JSONObject t, boolean done, PendingIntent open) {
                  RemoteViews rv = new RemoteViews(ctx.getPackageName(), R.layout.widget_task_item);
                  String title = t.optString("t", "");
                  int color;
                  try { color = android.graphics.Color.parseColor(t.optString("c", "#38bdf8")); }
                  catch (Throwable e) { color = 0xFF38BDF8; }

                  rv.setTextViewText(R.id.row_title, title);
                  rv.setTextViewText(R.id.row_check, done ? "✔" : "○");
                  try {
                      if (done && title.length() > 0) {
                          android.text.SpannableString s = new android.text.SpannableString(title);
                          s.setSpan(new android.text.style.StrikethroughSpan(), 0, title.length(), android.text.Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);
                          rv.setTextViewText(R.id.row_title, s);
                      }
                  } catch (Throwable ignored) {}
                  try { rv.setTextColor(R.id.row_title, done ? 0xFF64748B : 0xFFE2E8F0); } catch (Throwable ignored) {}
                  try { rv.setTextColor(R.id.row_check, done ? 0xFF4ADE80 : color); } catch (Throwable ignored) {}
                  try { rv.setInt(R.id.row_bar, "setBackgroundColor", done ? ((color & 0x00FFFFFF) | 0x55000000) : color); } catch (Throwable ignored) {}
                  try { rv.setInt(R.id.row_card, "setBackgroundResource", done ? R.drawable.widget_row_done_bg : R.drawable.widget_row_bg); } catch (Throwable ignored) {}
                  try { rv.setOnClickPendingIntent(R.id.row_card, open); } catch (Throwable ignored) {}
                  return rv;
              }

              static PendingIntent openApp(Context ctx, boolean mutable) {
                  Intent i = ctx.getPackageManager().getLaunchIntentForPackage(ctx.getPackageName());
                  if (i == null) i = new Intent();
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  int flags = PendingIntent.FLAG_UPDATE_CURRENT;
                  if (mutable) {
                      if (Build.VERSION.SDK_INT >= 31) flags |= PendingIntent.FLAG_MUTABLE;
                  } else if (Build.VERSION.SDK_INT >= 23) {
                      flags |= PendingIntent.FLAG_IMMUTABLE;
                  }
                  return PendingIntent.getActivity(ctx, mutable ? 7001 : 7002, i, flags);
              }
          }
          WEOF

