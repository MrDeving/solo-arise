                      rv.setTextViewText(R.id.row_title, title);
                      rv.setTextViewText(R.id.row_check, done ? "✓" : "");
                      String note = o.optString("n", "").trim();
                      boolean urgent = o.optInt("u", 0) == 1 && !done;
                      int streak = o.optInt("s", 0);
