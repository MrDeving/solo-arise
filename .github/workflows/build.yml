          package com.hunter.arisesolo;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.ServiceInfo;
          import android.content.res.AssetFileDescriptor;
          import android.media.AudioAttributes;
          import android.media.AudioFocusRequest;
          import android.media.AudioManager;
          import android.media.MediaPlayer;
          import android.media.RingtoneManager;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.PowerManager;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import androidx.core.app.NotificationCompat;
          import org.json.JSONArray;
          import org.json.JSONObject;

          // Plays the alarm sound on the ALARM volume stream, vibrates, and shows the full-screen alarm.
          public class AlarmService extends Service {
              static final String ACTION_RING = "com.hunter.arisesolo.ALARM_RING";
              static final String ACTION_STOP = "com.hunter.arisesolo.ALARM_STOP";
              static final String ACTION_SNOOZE = "com.hunter.arisesolo.ALARM_SNOOZE";
              static final String ACTION_COMPLETE = "com.hunter.arisesolo.ALARM_COMPLETE";
              static final String ACTION_SILENCE = "com.hunter.arisesolo.ALARM_SILENCE";
              static final String BROADCAST_STOPPED = "com.hunter.arisesolo.ALARM_STOPPED";
              static final String CHANNEL = "arise_alarm";
              static final int NOTIF_ID = 7421;
              static final long RING_MS = 2 * 60 * 1000L;
              static final int SNOOZE_MIN = 5;

              private MediaPlayer player;
              private Vibrator vibrator;
              private PowerManager.WakeLock wl;
              private android.media.session.MediaSession keySession;
              private Runnable volPoll;
              private int ringVol = -1;
              private boolean active = false;
              private AudioManager audio;
              private AudioFocusRequest focusReq;
              private final Handler handler = new Handler(Looper.getMainLooper());
              private String curTitle = "";
              private String curBody = "";
              private String curQuestId = "";
              private int curId = 0;

              private final Runnable timeout = new Runnable() {
                  @Override public void run() {
                      postMissed();
                      stopRinging();
                  }
              };

              @Override
              public IBinder onBind(Intent intent) { return null; }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent == null) { stopSelf(); return START_NOT_STICKY; }
                  String act = intent.getAction();
                  if (ACTION_SILENCE.equals(act)) { silence(); return START_NOT_STICKY; }
                  if (ACTION_STOP.equals(act)) { stopRinging(); return START_NOT_STICKY; }
                  if (ACTION_SNOOZE.equals(act)) { snooze(intent.getIntExtra("minutes", SNOOZE_MIN)); stopRinging(); return START_NOT_STICKY; }
                  if (ACTION_COMPLETE.equals(act)) { complete(); stopRinging(); return START_NOT_STICKY; }

                  curId = intent.getIntExtra("id", 0);
                  curTitle = nz(intent.getStringExtra("title"));
                  curBody = nz(intent.getStringExtra("body"));
                  curQuestId = nz(intent.getStringExtra("questId"));
                  startRinging();
                  return START_NOT_STICKY;
              }

              private static String nz(String s) { return s == null ? "" : s; }

              private PendingIntent svcPi(String action, int req) {
                  Intent i = new Intent(this, AlarmService.class).setAction(action);
                  return PendingIntent.getService(this, req, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }

              private Notification buildNotification() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                      NotificationChannel ch = new NotificationChannel(CHANNEL, "Quest Alarms", NotificationManager.IMPORTANCE_HIGH);
                      ch.setSound(null, null);
                      ch.enableVibration(false);
                      ch.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);
                      nm.createNotificationChannel(ch);
                  }
                  Intent act = new Intent(this, AlarmActivity.class);
                  act.putExtra("title", curTitle);
                  act.putExtra("body", curBody);
                  act.putExtra("questId", curQuestId);
                  act.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  PendingIntent full = PendingIntent.getActivity(this, 7410, act, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);

                  NotificationCompat.Builder b = new NotificationCompat.Builder(this, CHANNEL)
                      .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                      .setContentTitle(curTitle.isEmpty() ? "Quest alarm" : curTitle)
                      .setContentText(curBody)
                      .setCategory(NotificationCompat.CATEGORY_ALARM)
                      .setPriority(NotificationCompat.PRIORITY_MAX)
                      .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                      .setOngoing(true)
                      .setAutoCancel(false)
                      .setContentIntent(full)
                      .setFullScreenIntent(full, true);
                  if (!curQuestId.isEmpty()) b.addAction(0, "COMPLETE", svcPi(ACTION_COMPLETE, 7411));
                  b.addAction(0, "SNOOZE", svcPi(ACTION_SNOOZE, 7412));
                  b.addAction(0, "DISMISS", svcPi(ACTION_STOP, 7413));
                  return b.build();
              }

              private void startRinging() {
                  releaseMedia();
                  Notification n = buildNotification();
                  if (Build.VERSION.SDK_INT >= 29) startForeground(NOTIF_ID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK);
                  else startForeground(NOTIF_ID, n);
                  try {
                      PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                      wl = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "arisesolo:alarm");
                      wl.acquire(RING_MS + 15000L);
                  } catch (Throwable ignored) {}
                  int rm = ringerMode();
                  active = true;
                  startKeyCatcher();
                  startVolumeWatcher();
                  if (rm == AudioManager.RINGER_MODE_NORMAL) startSound();
                  if (rm != AudioManager.RINGER_MODE_SILENT) startVibration();
                  handler.removeCallbacks(timeout);
                  handler.postDelayed(timeout, RING_MS);
              }

              private int ringerMode() {
                  try {
                      return ((AudioManager) getSystemService(AUDIO_SERVICE)).getRingerMode();
                  } catch (Throwable t) {
                      return AudioManager.RINGER_MODE_NORMAL;
                  }
              }

              private AudioAttributes alarmAttrs() {
                  return new AudioAttributes.Builder()
                      .setUsage(AudioAttributes.USAGE_ALARM)
                      .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                      .build();
              }

              @SuppressWarnings("deprecation")
              private void startSound() {
                  try {
                      AudioAttributes aa = alarmAttrs();
                      audio = (AudioManager) getSystemService(AUDIO_SERVICE);
                      if (Build.VERSION.SDK_INT >= 26) {
                          focusReq = new AudioFocusRequest.Builder(AudioManager.AUDIOFOCUS_GAIN_TRANSIENT).setAudioAttributes(aa).build();
                          audio.requestAudioFocus(focusReq);
                      } else {
                          audio.requestAudioFocus(null, AudioManager.STREAM_ALARM, AudioManager.AUDIOFOCUS_GAIN_TRANSIENT);
                      }
                      MediaPlayer mp = new MediaPlayer();
                      mp.setAudioAttributes(aa);
                      try {
                          AssetFileDescriptor afd = null;
                          try {
                              android.net.Uri ru = RingtoneManager.getActualDefaultRingtoneUri(this, RingtoneManager.TYPE_ALARM);
                              if (ru == null) ru = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM);
                              mp.setDataSource(this, ru);
                          } catch (Throwable t0) {
                              mp.reset();
                              mp.setAudioAttributes(aa);
                              afd = getResources().openRawResourceFd(R.raw.mysound);
                          }
                          if (afd != null) mp.setDataSource(afd.getFileDescriptor(), afd.getStartOffset(), afd.getLength());
                          if (afd != null) afd.close();
                      } catch (Throwable t) {
                          mp.reset();
                          mp.setAudioAttributes(aa);
                          mp.setDataSource(this, RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM));
                      }
                      mp.setLooping(true);
                      mp.prepare();
                      mp.start();
                      player = mp;
                  } catch (Throwable ignored) {}
              }

              @SuppressWarnings("deprecation")
              private void startVibration() {
                  try {
                      vibrator = (Vibrator) getSystemService(VIBRATOR_SERVICE);
                      long[] pat = {0, 700, 500};
                      if (Build.VERSION.SDK_INT >= 26) vibrator.vibrate(VibrationEffect.createWaveform(pat, 0), alarmAttrs());
                      else vibrator.vibrate(pat, 0);
                  } catch (Throwable ignored) {}
              }

              @SuppressWarnings("deprecation")
              private void releaseMedia() {
                  stopVolumeWatcher();
                  stopKeyCatcher();
                  try { if (player != null) { player.stop(); player.release(); } } catch (Throwable ignored) {}
                  player = null;
                  try {
                      if (vibrator == null) vibrator = (Vibrator) getSystemService(VIBRATOR_SERVICE);
                      if (vibrator != null) vibrator.cancel();
                  } catch (Throwable ignored) {}
                  try {
                      if (audio != null) {
                          if (Build.VERSION.SDK_INT >= 26 && focusReq != null) audio.abandonAudioFocusRequest(focusReq);
                          else audio.abandonAudioFocus(null);
                      }
                  } catch (Throwable ignored) {}
                  try { if (wl != null && wl.isHeld()) wl.release(); } catch (Throwable ignored) {}
                  wl = null;
              }

              // Volume-down while ringing: stop the sound and vibration, keep the alarm on screen
              private void silence() {
                  if (!active) { stopSelf(); return; }
                  releaseMedia();
              }

              // Lets the volume-down button reach us even when the alarm screen is not in front
              private void startKeyCatcher() {
                  try {
                      stopKeyCatcher();
                      android.media.session.MediaSession ms = new android.media.session.MediaSession(this, "AriseAlarm");
                      ms.setPlaybackState(new android.media.session.PlaybackState.Builder()
                          .setState(android.media.session.PlaybackState.STATE_PLAYING, 0, 1f).build());
                      ms.setPlaybackToRemote(new android.media.VolumeProvider(android.media.VolumeProvider.VOLUME_CONTROL_RELATIVE, 100, 50) {
                          @Override public void onAdjustVolume(final int direction) {
                              if (direction < 0) {
                                  handler.post(new Runnable() {
                                      @Override public void run() { silence(); }
                                  });
                              }
                          }
                      });
                      ms.setActive(true);
                      keySession = ms;
                  } catch (Throwable ignored) {}
              }

              // Backup for locked / black-screen mode, where the volume key may never reach the media session:
              // if the alarm volume is pushed down while ringing, treat it as "silence" and put the volume back.
              private final int[] watchStreams = { AudioManager.STREAM_ALARM, AudioManager.STREAM_RING, AudioManager.STREAM_MUSIC, AudioManager.STREAM_NOTIFICATION, AudioManager.STREAM_SYSTEM };
              private final int[] watchVol = new int[5];
              private int watchRinger = AudioManager.RINGER_MODE_NORMAL;

              // Volume-down on the lock screen / in silent or vibrate mode usually changes the RING volume or the ringer mode,
              // not the alarm stream. So watch every stream plus the ringer mode, and treat any drop as "silence".
              private void startVolumeWatcher() {
                  try {
                      stopVolumeWatcher();
                      final AudioManager am = (AudioManager) getSystemService(AUDIO_SERVICE);
                      for (int i = 0; i < watchStreams.length; i++) watchVol[i] = am.getStreamVolume(watchStreams[i]);
                      watchRinger = am.getRingerMode();
                      volPoll = new Runnable() {
                          @Override public void run() {
                              if (!active) return;
                              try {
                                  int rm = am.getRingerMode();
                                  boolean pressed = rm < watchRinger;
                                  boolean[] dropped = new boolean[watchStreams.length];
                                  for (int i = 0; i < watchStreams.length; i++) {
                                      int v = am.getStreamVolume(watchStreams[i]);
                                      if (v < watchVol[i]) { pressed = true; dropped[i] = true; }
                                      else watchVol[i] = v;
                                  }
                                  if (pressed) {
                                      if (rm == watchRinger) {
                                          for (int i = 0; i < watchStreams.length; i++) {
                                              if (dropped[i]) { try { am.setStreamVolume(watchStreams[i], watchVol[i], 0); } catch (Throwable ignored) {} }
                                          }
                                      }
                                      silence();
                                      return;
                                  }
                                  watchRinger = rm;
                              } catch (Throwable ignored) {}
                              handler.postDelayed(this, 100);
                          }
                      };
                      handler.postDelayed(volPoll, 300);
                  } catch (Throwable ignored) {}
              }

              @SuppressWarnings("unused")
              private void startVolumeWatcherLegacy() {
                  try {
                      stopVolumeWatcher();
                      final AudioManager am = (AudioManager) getSystemService(AUDIO_SERVICE);
                      ringVol = am.getStreamVolume(AudioManager.STREAM_ALARM);
                      volPoll = new Runnable() {
                          @Override public void run() {
                              if (!active) return;
                              try {
                                  int v = am.getStreamVolume(AudioManager.STREAM_ALARM);
                                  if (v < ringVol) {
                                      int keep = ringVol;
                                      silence();
                                      try { am.setStreamVolume(AudioManager.STREAM_ALARM, keep, 0); } catch (Throwable ignored) {}
                                      return;
                                  }
                                  ringVol = v;
                              } catch (Throwable ignored) {}
                              handler.postDelayed(this, 120);
                          }
                      };
                      handler.postDelayed(volPoll, 300);
                  } catch (Throwable ignored) {}
              }

              private void stopVolumeWatcher() {
                  try { if (volPoll != null) handler.removeCallbacks(volPoll); } catch (Throwable ignored) {}
                  volPoll = null;
              }

              private void stopKeyCatcher() {
                  try {
                      if (keySession != null) {
                          keySession.setActive(false);
                          keySession.release();
                      }
                  } catch (Throwable ignored) {}
                  keySession = null;
              }

              private void snooze(int minutes) {
                  AlarmScheduler.scheduleOne(this, 1900000000 + (curId % 1000),
                      System.currentTimeMillis() + minutes * 60000L, curTitle, curBody, curQuestId);
              }

              // Same hand-off the home-screen widgets use: the app ticks the quest next time it is visible.
              private void complete() {
                  try {
                      if (curQuestId.isEmpty()) return;
                      SharedPreferences p = getSharedPreferences("CapacitorStorage", Context.MODE_PRIVATE);
                      JSONArray a = new JSONArray(p.getString("widget_actions", "[]"));
                      JSONObject o = new JSONObject();
                      o.put("id", curQuestId);
                      o.put("t", "task");
                      o.put("d", true);
                      a.put(o);
                      p.edit().putString("widget_actions", a.toString()).apply();
                  } catch (Throwable ignored) {}
              }

              private void postMissed() {
                  try {
                      NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                      if (Build.VERSION.SDK_INT >= 26) {
                          nm.createNotificationChannel(new NotificationChannel("arise_alarm_missed", "Missed alarms", NotificationManager.IMPORTANCE_DEFAULT));
                      }
                      Intent launch = getPackageManager().getLaunchIntentForPackage(getPackageName());
                      NotificationCompat.Builder b = new NotificationCompat.Builder(this, "arise_alarm_missed")
                          .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                          .setContentTitle("Missed: " + curTitle)
                          .setContentText(curBody)
                          .setAutoCancel(true);
                      if (launch != null) {
                          b.setContentIntent(PendingIntent.getActivity(this, 7430, launch, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE));
                      }
                      nm.notify(7500 + (curId % 1000), b.build());
                  } catch (Throwable ignored) {}
              }

              @SuppressWarnings("deprecation")
              private void stopRinging() {
                  handler.removeCallbacks(timeout);
                  releaseMedia();
                  active = false;
                  try { sendBroadcast(new Intent(BROADCAST_STOPPED).setPackage(getPackageName())); } catch (Throwable ignored) {}
                  try { stopForeground(true); } catch (Throwable ignored) {}
                  try { ((NotificationManager) getSystemService(NOTIFICATION_SERVICE)).cancel(NOTIF_ID); } catch (Throwable ignored) {}
                  stopSelf();
              }

              @Override
              public void onDestroy() {
                  handler.removeCallbacks(timeout);
                  releaseMedia();
                  super.onDestroy();
              }
          }
          JEOF

