          a('                        android:minWidth="18dp" android:gravity="center" android:paddingStart="6dp" android:paddingEnd="6dp"')
          a('                        android:paddingTop="1dp" android:paddingBottom="1dp" android:textSize="11sp" android:textStyle="bold" android:textColor="#FFFFFF"/>')
          a('                </FrameLayout>')
          a('            </LinearLayout>')
