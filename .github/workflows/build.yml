      - name: Create native alarm system
        run: |
          D=android/app/src/main/java/com/hunter/arisesolo

          cat > $D/AlarmScheduler.java << 'JEOF'
          package com.hunter.arisesolo;

          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import org.json.JSONArray;
          import org.json.JSONObject;

          // Registers real alarm-clock alarms (they fire even in Doze) and remembers them so a reboot can restore them.
          public final class AlarmScheduler {
              static final String PREFS = "AriseAlarms";
              static final String KEY = "list";
              static final int MAX_ALARMS = 150;

              private AlarmScheduler() {}

              static SharedPreferences prefs(Context ctx) {
                  return ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
              }

              static PendingIntent firePi(Context ctx, int id, String title, String body, String questId) {
                  Intent i = new Intent(ctx, AlarmReceiver.class);
                  i.putExtra("id", id);
                  i.putExtra("title", title);
                  i.putExtra("body", body);
                  i.putExtra("questId", questId);
                  return PendingIntent.getBroadcast(ctx, id, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }

              static void cancelStored(Context ctx) {
                  try {
                      AlarmManager am = (AlarmManager) ctx.getSystemService(Context.ALARM_SERVICE);
                      JSONArray a = new JSONArray(prefs(ctx).getString(KEY, "[]"));
                      for (int k = 0; k < a.length(); k++) {
                          JSONObject o = a.getJSONObject(k);
                          am.cancel(firePi(ctx, o.getInt("id"), "", "", ""));
                      }
                  } catch (Throwable ignored) {}
              }

              static void scheduleStored(Context ctx) {
                  try {
                      JSONArray a = new JSONArray(prefs(ctx).getString(KEY, "[]"));
                      long now = System.currentTimeMillis();
                      for (int k = 0; k < a.length(); k++) {
                          JSONObject o = a.getJSONObject(k);
                          long at = o.getLong("at");
                          if (at <= now) continue;
                          scheduleOne(ctx, o.getInt("id"), at, o.optString("title", ""), o.optString("body", ""), o.optString("questId", ""));
                      }
                  } catch (Throwable ignored) {}
              }

              static void scheduleOne(Context ctx, int id, long at, String title, String body, String questId) {
                  try {
                      AlarmManager am = (AlarmManager) ctx.getSystemService(Context.ALARM_SERVICE);
                      Intent launch = ctx.getPackageManager().getLaunchIntentForPackage(ctx.getPackageName());
                      if (launch == null) launch = new Intent();
                      PendingIntent show = PendingIntent.getActivity(ctx, 7400, launch, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                      am.setAlarmClock(new AlarmManager.AlarmClockInfo(at, show), firePi(ctx, id, title, body, questId));
                  } catch (Throwable ignored) {}
              }

              static void replaceAll(Context ctx, JSONArray list) {
                  cancelStored(ctx);
                  prefs(ctx).edit().putString(KEY, list.toString()).apply();
                  scheduleStored(ctx);
              }
          }
          JEOF

          cat > $D/AlarmPlugin.java << 'JEOF'
          package com.hunter.arisesolo;

          import android.app.NotificationManager;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import org.json.JSONArray;
          import org.json.JSONObject;

          @CapacitorPlugin(name = "QuestAlarm")
          public class AlarmPlugin extends Plugin {

              @PluginMethod
              public void setAlarms(PluginCall call) {
                  try {
                      JSArray in = call.getArray("alarms");
                      JSONArray out = new JSONArray();
                      if (in != null) {
                          for (int i = 0; i < in.length() && out.length() < AlarmScheduler.MAX_ALARMS; i++) {
                              JSONObject o = in.getJSONObject(i);
                              JSONObject n = new JSONObject();
                              n.put("id", o.getInt("id"));
                              n.put("at", o.getLong("at"));
                              n.put("title", o.optString("title", ""));
                              n.put("body", o.optString("body", ""));
                              n.put("questId", o.optString("questId", ""));
                              out.put(n);
                          }
                      }
                      AlarmScheduler.replaceAll(getContext(), out);
                      JSObject r = new JSObject();
                      r.put("count", out.length());
                      r.put("fullScreen", fullScreenAllowed());
                      call.resolve(r);
                  } catch (Exception e) {
                      call.reject(String.valueOf(e.getMessage()));
                  }
              }

              @PluginMethod
              public void cancelAll(PluginCall call) {
                  AlarmScheduler.replaceAll(getContext(), new JSONArray());
                  call.resolve();
              }

              @PluginMethod
              public void openFullScreenSettings(PluginCall call) {
                  try {
                      if (Build.VERSION.SDK_INT >= 34) {
                          Intent i = new Intent(Settings.ACTION_MANAGE_APP_USE_FULL_SCREEN_INTENT, Uri.parse("package:" + getContext().getPackageName()));
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          getContext().startActivity(i);
                      }
                  } catch (Throwable ignored) {}
                  call.resolve();
              }

              @PluginMethod
              public void testAlarm(PluginCall call) {
                  int sec = call.getInt("seconds", 10);
                  AlarmScheduler.scheduleOne(getContext(), 1899999999, System.currentTimeMillis() + sec * 1000L,
                      "Test alarm", "This is how your quest alarms will look and sound.", "");
                  call.resolve();
              }

              @PluginMethod
              public void setTheme(PluginCall call) {
                  try {
                      JSObject d = call.getData();
                      getContext().getSharedPreferences(AlarmScheduler.PREFS, Context.MODE_PRIVATE).edit().putString("theme", d.toString()).apply();
                  } catch (Throwable ignored) {}
                  call.resolve();
              }

              private boolean fullScreenAllowed() {
                  try {
                      if (Build.VERSION.SDK_INT >= 34) {
                          NotificationManager nm = (NotificationManager) getContext().getSystemService(Context.NOTIFICATION_SERVICE);
                          return nm.canUseFullScreenIntent();
                      }
                  } catch (Throwable ignored) {}
                  return true;
              }
          }
